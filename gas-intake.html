<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Газовые СИ</title></head>
<body><p id="loading">Открываю газовую приёмку...</p>
<script>
(async function(){
  try {
    var response=await fetch('index.html',{cache:'no-cache'});
    if(!response.ok)throw new Error('Не удалось загрузить форму: HTTP '+response.status);
    var html=await response.text();
    var required=['function initPriemkaMode','function submitAct','// КОНФИГУРАЦИЯ','<script src="gas.js"><'+'/script>'];
    required.forEach(function(marker){if(!html.includes(marker))throw new Error('Структура основной формы изменилась: '+marker);});
    html=html.replace('<title>Приёмка СИ</title>','<title>Газовые СИ — приёмка</title>');
    html=html.replace('</head>','<link rel="stylesheet" href="gas-arshin.css?v=1"><style>#archiveContent .act-item,#actsList .act-item{box-sizing:border-box!important;background:#ffffff!important;color:#0f172a!important;-webkit-text-fill-color:#0f172a!important;opacity:1!important;text-shadow:none!important;font-size:16px!important;font-weight:500!important;line-height:1.6!important;padding:16px!important;margin:10px 0!important;border:1px solid #94a3b8!important;border-radius:12px!important;height:auto!important;min-height:64px!important;max-height:none!important;white-space:normal!important;overflow-wrap:anywhere!important;overflow:visible!important;text-overflow:clip!important;cursor:pointer}#archiveContent .act-item *,#actsList .act-item *{color:inherit!important;-webkit-text-fill-color:inherit!important;opacity:1!important;text-shadow:none!important}#archiveContent .act-item:hover,#actsList .act-item:hover{background:#e2e8f0!important;border-color:#2563eb!important}#archiveContent .act-item:focus-visible,#actsList .act-item:focus-visible{outline:3px solid #2563eb!important;outline-offset:3px!important}</style></head>');
    ['priemkaFormData','cache_devices','cardStatusBackup'].forEach(function(key){html=html.split("'"+key+"'").join("'gas_"+key+"'");});
    html=html.split("SCRIPT_URL+'?action=").join("gasApiUrl()+'&action=gas_");
    html=html.split('form.action=SCRIPT_URL;').join('form.action=gasApiUrl();');
    html=html.replace('// КОНФИГУРАЦИЯ',"function gasApiUrl(){return SCRIPT_URL+'?section=gas';}\n// КОНФИГУРАЦИЯ");
    html=html.replace('<script src="gas.js"><'+'/script>','<script src="gas-intake.js?v=2"><'+'/script><script src="gas-personal.js?v=4"><'+'/script><script src="gas-arshin.js?v=1"><'+'/script>');
    html=html.replace('<h1>📋 Меню</h1>','<h1>Газовые СИ</h1>');
    html=html.replace('<div id="mainMenu">','<div id="mainMenu"><a class="btn-back" href="index.html">В основное приложение</a>');
    html=html.replaceAll('📝 Приёмка СИ','Приёмка газовых СИ').replace('<h3>Приёмка СИ</h3>','<h3>Приёмка газовых СИ</h3>');
    document.open();document.write(html);document.close();
  }catch(error){document.getElementById('loading').textContent=error.message;}
})();
</script></body></html>
