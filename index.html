<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Приёмка СИ</title>
    <link rel="icon" type="image/png" href="https://drive.google.com/uc?export=view&id=1iygIPf19buf7dI3O0lR3i-u5gZblkPjH">
    <link rel="apple-touch-icon" href="https://drive.google.com/uc?export=view&id=1iygIPf19buf7dI3O0lR3i-u5gZblkPjH">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; padding: 15px; max-width: 500px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .header h1 { font-size: 20px; color: #333; }
        .header p { font-size: 12px; color: #888; margin-top: 5px; }
        .btn-settings { background: none; border: none; font-size: 24px; cursor: pointer; }
        .field-group { margin-bottom: 10px; }
        .field-group label { display: block; font-size: 13px; font-weight: bold; color: #555; margin-bottom: 4px; }
        .field-row { display: flex; gap: 6px; }
        .field-row input, .field-row select { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; background: #fff; }
        .btn-camera { background: #4CAF50; color: #fff; border: none; border-radius: 8px; padding: 10px 14px; font-size: 18px; cursor: pointer; min-width: 46px; flex: 0 0 auto; }
        .btn-voice { background: #E91E63; color: #fff; border: none; border-radius: 8px; padding: 10px 14px; font-size: 18px; cursor: pointer; min-width: 46px; flex: 0 0 auto; transition: all 0.3s; }
        .btn-voice.listening { background: #FF5722; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
        .btn-remove { background: #f44336; color: #fff; border: none; border-radius: 8px; padding: 10px 14px; font-size: 16px; cursor: pointer; min-width: 46px; flex: 0 0 auto; }
        .btn-new-act { background: #FF9800; color: #fff; border: none; border-radius: 8px; padding: 12px 16px; font-size: 15px; cursor: pointer; margin-right: 8px; }
        .btn-select-act { background: #9C27B0; color: #fff; border: none; border-radius: 8px; padding: 12px 16px; font-size: 15px; cursor: pointer; }
        .btn-add-device { width: 100%; background: #2196F3; color: #fff; border: none; border-radius: 8px; padding: 14px; font-size: 16px; cursor: pointer; margin: 10px 0; }
        .btn-submit { width: 100%; background: #FF5722; color: #fff; border: none; border-radius: 8px; padding: 16px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-submit:disabled { background: #ccc; }
        .device-block { background: #fff; border: 1px solid #e0e0e0; border-radius: 12px; padding: 12px; margin-bottom: 12px; position: relative; }
        .device-title { font-size: 14px; font-weight: bold; color: #333; margin-bottom: 8px; }
        .device-number { background: #eee; border-radius: 50%; width: 24px; height: 24px; display: inline-block; text-align: center; line-height: 24px; font-size: 13px; margin-right: 6px; }
        .preview { width: 100%; max-height: 150px; object-fit: contain; margin-top: 4px; border-radius: 8px; display: none; }
        .status { text-align: center; margin-top: 15px; font-size: 13px; color: #666; min-height: 20px; }
        .status.success { color: #4CAF50; } .status.error { color: #f44336; } .status.loading { color: #FF9800; }
        .hint { font-size: 11px; color: #999; margin-top: 3px; text-align: center; }
        .section-title { font-size: 14px; color: #888; margin: 15px 0 8px; border-top: 1px solid #ddd; padding-top: 12px; }
        input[type="file"] { display: none; }
        .act-toolbar { display: flex; gap: 8px; margin-bottom: 12px; }
        .checkbox-row { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 14px; }
        .checkbox-row input { width: 18px; height: 18px; }
        .autocomplete-wrap { position: relative; flex: 1; }
        .autocomplete-list { position: absolute; top: 100%; left: 0; right: 0; max-height: 200px; overflow-y: auto; background: #fff; border: 1px solid #ddd; border-radius: 0 0 8px 8px; z-index: 100; display: none; list-style: none; }
        .autocomplete-list li { padding: 10px; cursor: pointer; font-size: 14px; border-bottom: 1px solid #eee; }
        .autocomplete-list li:hover, .autocomplete-list li.active { background: #E3F2FD; }
        .autocomplete-list li:last-child { border-bottom: none; }
        #settingsPanel { display: none; background: #fff; border: 1px solid #ddd; border-radius: 12px; padding: 15px; margin-bottom: 15px; }
        #settingsPanel h3 { margin-bottom: 12px; }
        #settingsPanel input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; margin-bottom: 8px; }
        #settingsPanel .btn-save { width: 100%; background: #4CAF50; color: #fff; border: none; border-radius: 8px; padding: 10px; font-size: 15px; cursor: pointer; }
        #cameraOverlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; }
        #cameraVideo { width: 100%; height: 100%; object-fit: cover; }
        #cameraFrame { position: absolute; border: 3px solid #4CAF50; border-radius: 12px; box-shadow: 0 0 0 9999px rgba(0,0,0,0.55); }
        #cameraFrameLabel { position: absolute; top: -28px; left: 0; width: 100%; text-align: center; color: #fff; font-size: 13px; font-weight: bold; }
        #cameraControls { position: absolute; bottom: 130px; left: 0; width: 100%; display: flex; justify-content: center; gap: 10px; z-index: 10001; flex-wrap: wrap; }
        #cameraControls button { width: 42px; height: 42px; border-radius: 50%; border: 2px solid #fff; background: rgba(0,0,0,0.6); color: #fff; font-size: 18px; cursor: pointer; }
        #cameraCaptureBtn { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); width: 70px; height: 70px; background: #fff; border: 4px solid #4CAF50; border-radius: 50%; cursor: pointer; z-index: 10001; }
        #cameraCloseBtn { position: absolute; top: 20px; right: 20px; background: none; border: none; color: #fff; font-size: 30px; cursor: pointer; z-index: 10001; }
        .control-label { color: #fff; font-size: 10px; text-align: center; margin: 2px 0; }
        #actsModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 9999; }
        #actsModal .modal-content { background: #fff; margin: 40px auto; padding: 20px; border-radius: 12px; max-width: 450px; max-height: 80%; overflow-y: auto; }
        #actsModal h3 { margin-bottom: 15px; }
        #actsModal .act-item { padding: 12px; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 8px; cursor: pointer; }
        #actsModal .act-item:hover { background: #f0f0f0; }
        #actsModal .btn-close { background: #f44336; color: #fff; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; margin-top: 10px; }
        .serial-row { display: flex; gap: 6px; align-items: center; }
        .serial-row span { font-size: 20px; font-weight: bold; color: #888; padding: 0 4px; }
        .serial-row input { flex: 1; }
        
        /* Стили для вариантов распознавания */
        .voice-variants { margin-top: 8px; display: none; }
        .voice-variants.active { display: block; }
        .voice-variant-item { padding: 8px 12px; margin: 4px 0; background: #f0f0f0; border-radius: 6px; cursor: pointer; font-size: 14px; transition: all 0.2s; }
        .voice-variant-item:hover { background: #E3F2FD; transform: scale(1.02); }
        .voice-variant-item.selected { background: #4CAF50; color: white; }
        .voice-status { font-size: 11px; color: #E91E63; margin-top: 4px; display: none; }
        .voice-status.active { display: block; }
        
        /* Индикатор записи для кнопки в строке */
        .voice-row-indicator { display: none; position: absolute; top: -8px; right: -8px; width: 16px; height: 16px; background: #FF5722; border-radius: 50%; animation: pulse 1s infinite; }
        .voice-row-indicator.active { display: block; }
    </style>
</head>
<body>
    <div class="header">
        <div><h1>📋 Приёмка СИ</h1><p>ООО МС «ЦЕНТР ИЗМЕРЕНИЙ»</p></div>
        <button class="btn-settings" onclick="toggleSettings()" title="Настройки">⚙️</button>
    </div>
    <div id="settingsPanel">
        <h3>⚙️ Настройки</h3>
        <label>Email для отправки актов:</label>
        <input type="email" id="settingsEmail" placeholder="ms-tcentr@mail.ru">
        <button class="btn-save" onclick="saveSettings()">💾 Сохранить</button>
    </div>
    <div class="act-toolbar">
        <button class="btn-new-act" onclick="newAct()">📝 Новый акт</button>
        <button class="btn-select-act" onclick="openActsList()">📂 Выбрать акт</button>
    </div>
    <div class="field-group"><label>Компания-сдатчик:</label><div class="field-row"><select id="companySelect"><option value="">-- Загрузка... --</option></select><button class="btn-camera" onclick="addCompany()" style="font-size:20px;">➕</button></div></div>
    <div class="field-group"><label>Кто принял:</label><select id="employeeSelect"><option value="">-- Загрузка... --</option></select></div>
    <div class="section-title">Приборы:</div>
    <div id="devicesContainer"></div>
    <button class="btn-add-device" onclick="addDevice()">➕ Добавить прибор</button>
    <button class="btn-submit" id="submitBtn" onclick="submitAct()">📧 Сформировать акт и отправить</button>
    <div class="hint" id="emailHint">Письмо уйдёт на ms-tcentr@mail.ru</div>
    <div class="status" id="status"></div>

    <div id="cameraOverlay">
        <video id="cameraVideo" autoplay playsinline></video>
        <div id="cameraFrame"><div id="cameraFrameLabel">Поместите текст в рамку</div></div>
        <div id="cameraControls">
            <div style="text-align:center;"><div class="control-label">Высота</div><button onclick="changeFrameSize(0,-15)">−</button><button onclick="changeFrameSize(0,15)">+</button></div>
            <div style="text-align:center;"><div class="control-label">Шире</div><button onclick="changeFrameSize(-8,0)">◀</button><button onclick="changeFrameSize(8,0)">▶</button></div>
            <div style="text-align:center;"><div class="control-label">Уже</div><button onclick="changeFrameSize(-4,0)">◁</button><button onclick="changeFrameSize(4,0)">▷</button></div>
        </div>
        <button id="cameraCloseBtn" onclick="closeCamera()">✕</button>
        <button id="cameraCaptureBtn" onclick="captureFromCamera()"></button>
    </div>
    <div id="actsModal">
        <div class="modal-content">
            <h3>📂 Существующие акты</h3>
            <div id="actsList">Загрузка...</div>
            <button class="btn-close" onclick="closeActsList()">Закрыть</button>
        </div>
    </div>
    <iframe name="hiddenFrame" style="display:none;"></iframe>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script>
        var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyJsAHDVPiWNFJl5xU_Iq5ncY7tILkr_T18D1zZKCQ8WQA8iFheE2L2MQ_9yzUQ4DsS/exec';
        var CSV_BASE = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQJLJVjVpDuLsNRjFg9j7X2NHcDtOgmo4lhiC_CTx2S0ox97Hne91SXQ7XtJJxb9OberlzYUrSXijw6/pub?output=csv&gid=';
        var GID_TYPES = '441822937', GID_COMPANIES = '883764981', GID_EMPLOYEES = '1294860374';
        var typesData = [], deviceCounter = 0, cameraStream = null;
        var currentCameraTarget = null, currentCameraDevice = null;
        var frameSettings = JSON.parse(localStorage.getItem('cameraFrame') || '{"top":"35%","width":"80%","height":"80px"}');
        var settings = JSON.parse(localStorage.getItem('appSettings') || '{"email":"ms-tcentr@mail.ru"}');
        var usedAddresses = [];

        var recognition = null;
        var isVoiceSupported = false;
        var isListening = false;
        var currentVoiceDevice = null;
        var currentVoiceField = null;
        var voiceResults = [];
        var allTypesFromSheet = [];

        window.addEventListener('load', function() {
            document.getElementById('settingsEmail').value = settings.email;
            document.getElementById('emailHint').textContent = 'Письмо уйдёт на ' + settings.email;
            setStatus('Загрузка справочников...', 'loading');
            loadDictionaries();
            loadAllTypesFromSheet();
            addDevice();
            initVoiceRecognition();
        });

        function toggleSettings() { var p = document.getElementById('settingsPanel'); p.style.display = p.style.display === 'none' ? 'block' : 'none'; }
        function saveSettings() { settings.email = document.getElementById('settingsEmail').value.trim() || 'ms-tcentr@mail.ru'; localStorage.setItem('appSettings', JSON.stringify(settings)); document.getElementById('emailHint').textContent = 'Письмо уйдёт на ' + settings.email; document.getElementById('settingsPanel').style.display = 'none'; setStatus('✅ Настройки сохранены', 'success'); }

        function loadDictionaries() {
            Promise.all([fetch(CSV_BASE+GID_TYPES).then(r=>r.text()), fetch(CSV_BASE+GID_COMPANIES).then(r=>r.text()), fetch(CSV_BASE+GID_EMPLOYEES).then(r=>r.text())])
            .then(function(r){ typesData=parseCSV(r[0]); updateSelect('companySelect',parseCSV(r[1]),0); updateSelect('employeeSelect',parseCSV(r[2]),1); setStatus('✅ Готов к работе','success'); })
            .catch(function(){ setStatus('⚠️ Справочники не загружены','error'); });
        }

        function loadAllTypesFromSheet() {
            fetch(CSV_BASE + GID_TYPES)
                .then(function(response) {
                    if (!response.ok) throw new Error('Ошибка загрузки');
                    return response.text();
                })
                .then(function(csv) {
                    var data = parseCSV(csv);
                    allTypesFromSheet = [];
                    data.forEach(function(row) {
                        for (var i = 0; i < row.length; i++) {
                            var value = (row[i] || '').trim();
                            if (value && value.length > 2 && allTypesFromSheet.indexOf(value) === -1) {
                                allTypesFromSheet.push(value);
                            }
                        }
                    });
                    console.log('📋 Загружено типов: ' + allTypesFromSheet.length);
                })
                .catch(function(error) {
                    console.error('Ошибка загрузки типов:', error);
                });
        }

        function parseCSV(csv) { var lines=csv.trim().split('\n'), result=[]; for(var i=1;i<lines.length;i++){ var cells=[],cur='',q=false; for(var j=0;j<lines[i].length;j++){ var c=lines[i][j]; if(c=='"')q=!q; else if(c===','&&!q){cells.push(cur.trim());cur='';} else cur+=c; } cells.push(cur.trim()); if(cells.some(function(c){return c.length>0;})) result.push(cells); } return result; }
        function updateSelect(id,data,col){ var sel=document.getElementById(id); sel.innerHTML='<option value="">-- Выберите --</option>'; var names=[]; data.forEach(function(r){ var v=r[col]||r[0]||''; if(v&&names.indexOf(v)===-1){names.push(v); sel.innerHTML+='<option value="'+esc(v)+'">'+esc(v)+'</option>'; } }); }
        function getTypeNames(){ var names=[]; typesData.forEach(function(r){ var n=r[1]||r[0]||''; if(n&&names.indexOf(n)===-1) names.push(n); }); return names; }

        function initVoiceRecognition() {
            var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (SpeechRecognition) {
                recognition = new SpeechRecognition();
                recognition.lang = 'ru-RU';
                recognition.interimResults = false;
                recognition.continuous = false;
                recognition.maxAlternatives = 5;

                recognition.onresult = function(event) {
                    voiceResults = [];
                    for (var i = 0; i < event.results.length; i++) {
                        for (var j = 0; j < event.results[i].length; j++) {
                            voiceResults.push(event.results[i][j].transcript.trim());
                        }
                    }
                    
                    if (voiceResults.length > 0 && currentVoiceDevice && currentVoiceField) {
                        if (currentVoiceField === 'name') {
                            showVoiceVariants(voiceResults);
                        } else {
                            // Для других полей берём первый результат
                            var field = document.getElementById(currentVoiceField + currentVoiceDevice);
                            if (field) field.value = voiceResults[0];
                            stopVoiceInput();
                        }
                    }
                };

                recognition.onerror = function(event) {
                    console.log('Voice error:', event.error);
                    stopVoiceInput();
                };

                recognition.onend = function() {
                    if (isListening) {
                        stopVoiceInput();
                    }
                };

                isVoiceSupported = true;
            }
        }

        function startVoiceInput(deviceNum, field) {
            if (!isVoiceSupported) {
                alert('Голосовой ввод не поддерживается. Используйте Chrome.');
                return;
            }
            
            if (isListening) {
                stopVoiceInput();
                return;
            }
            
            currentVoiceDevice = deviceNum;
            currentVoiceField = field;
            isListening = true;
            voiceResults = [];
            
            // Активируем кнопку
            var btn = document.querySelector('.voice-btn-' + field + '-' + deviceNum);
            if (btn) btn.classList.add('listening');
            
            // Показываем статус
            var statusEl = document.getElementById('voiceStatus' + deviceNum);
            if (statusEl) {
                statusEl.textContent = '🎤 Говорите...';
                statusEl.classList.add('active');
            }
            
            // Скрываем старые варианты
            var variantsEl = document.getElementById('voiceVariants' + deviceNum);
            if (variantsEl) {
                variantsEl.classList.remove('active');
                variantsEl.innerHTML = '';
            }
            
            try { recognition.start(); } catch(e) {}
            setStatus('🎤 Слушаю...', 'loading');
        }

        function stopVoiceInput() {
            isListening = false;
            
            // Деактивируем все кнопки
            document.querySelectorAll('.btn-voice').forEach(function(b) { b.classList.remove('listening'); });
            
            // Скрываем все статусы
            document.querySelectorAll('.voice-status').forEach(function(s) { s.classList.remove('active'); });
            
            try { recognition.stop(); } catch(e) {}
            
            setStatus('✅ Готов', 'success');
        }

        function showVoiceVariants(results) {
            if (!currentVoiceDevice) return;
            
            var variantsEl = document.getElementById('voiceVariants' + currentVoiceDevice);
            var statusEl = document.getElementById('voiceStatus' + currentVoiceDevice);
            
            if (!variantsEl) return;
            
            // Ищем совпадения типов для каждого варианта
            var allVariants = [];
            results.forEach(function(text) {
                var matches = findTypeMatches(text);
                matches.forEach(function(match) {
                    // Проверяем, нет ли уже такого варианта
                    var exists = allVariants.some(function(v) { return v.name === match.name; });
                    if (!exists) {
                        allVariants.push(match);
                    }
                });
            });
            
            // Если нет совпадений, показываем сырой текст
            if (allVariants.length === 0) {
                results.forEach(function(text) {
                    if (text.length > 3) {
                        allVariants.push({ name: text, score: 0 });
                    }
                });
            }
            
            // Сортируем по скору
            allVariants.sort(function(a, b) { return b.score - a.score; });
            
            // Показываем топ-5
            var topVariants = allVariants.slice(0, 5);
            
            if (topVariants.length > 0) {
                variantsEl.innerHTML = '';
                topVariants.forEach(function(variant, index) {
                    var item = document.createElement('div');
                    item.className = 'voice-variant-item';
                    item.textContent = (index + 1) + '. ' + variant.name;
                    item.onclick = function() {
                        selectVoiceVariant(variant.name);
                    };
                    variantsEl.appendChild(item);
                });
                variantsEl.classList.add('active');
                
                if (statusEl) {
                    statusEl.textContent = '✅ Выберите вариант из списка';
                    statusEl.classList.add('active');
                }
            } else {
                if (statusEl) {
                    statusEl.textContent = '⚠️ Ничего не распознано';
                    statusEl.classList.add('active');
                }
            }
            
            stopVoiceInput();
        }

        function selectVoiceVariant(name) {
            if (!currentVoiceDevice) return;
            
            // Заполняем поле названия
            var nameField = document.getElementById('nameField' + currentVoiceDevice);
            if (nameField) nameField.value = name;
            
            // Автоподбор типа
            var ft = findTypeByName(name);
            if (ft) {
                var typeField = document.getElementById('typeField' + currentVoiceDevice);
                if (typeField) {
                    typeField.value = ft;
                    checkType(currentVoiceDevice);
                }
            }
            
            // Скрываем варианты
            var variantsEl = document.getElementById('voiceVariants' + currentVoiceDevice);
            if (variantsEl) {
                variantsEl.classList.remove('active');
                variantsEl.innerHTML = '';
            }
            
            var statusEl = document.getElementById('voiceStatus' + currentVoiceDevice);
            if (statusEl) {
                statusEl.textContent = '✅ Выбрано: ' + name;
                statusEl.classList.add('active');
                setTimeout(function() { statusEl.classList.remove('active'); }, 2000);
            }
            
            currentVoiceDevice = null;
            currentVoiceField = null;
            setStatus('✅ ' + name, 'success');
        }

        function findTypeMatches(text) {
            if (!text) return [];
            
            var cleanText = text.toLowerCase().replace(/[^a-zа-я0-9\s]/g, ' ').replace(/\s+/g, ' ').trim();
            var typesToSearch = allTypesFromSheet.length > 0 ? allTypesFromSheet : getTypeNames();
            var words = cleanText.split(/\s+/);
            var results = [];
            
            typesToSearch.forEach(function(sheetType) {
                var typeClean = sheetType.toLowerCase().replace(/[^a-zа-я0-9\s]/g, ' ').replace(/\s+/g, ' ').trim();
                if (typeClean.length < 2) return;
                
                var score = calculateMatchScore(cleanText, words, typeClean);
                if (score > 10) {
                    results.push({ name: sheetType, score: score });
                }
            });
            
            results.sort(function(a, b) { return b.score - a.score; });
            return results.slice(0, 5);
        }

        function calculateMatchScore(text, textWords, typeName) {
            var score = 0;
            var typeWords = typeName.split(/\s+/);
            
            if (text.indexOf(typeName) !== -1) {
                score += 100;
            }
            
            var matchedWords = 0;
            typeWords.forEach(function(typeWord) {
                if (typeWord.length < 2) return;
                
                for (var i = 0; i < textWords.length; i++) {
                    var textWord = textWords[i];
                    
                    if (textWord === typeWord) {
                        score += 30;
                        matchedWords++;
                    } else if (typeWord.startsWith(textWord) && textWord.length >= 2) {
                        score += 20;
                        matchedWords++;
                    } else if (textWord.startsWith(typeWord) && typeWord.length >= 2) {
                        score += 15;
                        matchedWords++;
                    } else {
                        var similarity = stringSimilarity(textWord, typeWord);
                        if (similarity > 0.6 && typeWord.length >= 3) {
                            score += Math.floor(similarity * 20);
                            matchedWords++;
                        }
                    }
                }
            });
            
            if (matchedWords >= typeWords.length) score += 50;
            else if (matchedWords > 0) score += matchedWords * 8;
            
            var abbr = typeName.replace(/[^a-zа-я]/g, '');
            if (abbr.length >= 2 && text.indexOf(abbr) !== -1) score += 40;
            
            score += Math.min(typeName.length, 15);
            
            return score;
        }

        function stringSimilarity(s1, s2) {
            if (!s1 || !s2) return 0;
            if (s1 === s2) return 1.0;
            var longer = s1.length > s2.length ? s1 : s2;
            var shorter = s1.length > s2.length ? s2 : s1;
            var longerLength = longer.length;
            if (longerLength === 0) return 1.0;
            return (longerLength - editDistance(longer, shorter)) / parseFloat(longerLength);
        }

        function editDistance(s1, s2) {
            s1 = s1.toLowerCase();
            s2 = s2.toLowerCase();
            var costs = [];
            for (var i = 0; i <= s1.length; i++) {
                var lastValue = i;
                for (var j = 0; j <= s2.length; j++) {
                    if (i === 0) costs[j] = j;
                    else if (j > 0) {
                        var newValue = costs[j - 1];
                        if (s1.charAt(i - 1) !== s2.charAt(j - 1)) newValue = Math.min(Math.min(newValue, lastValue), costs[j]) + 1;
                        costs[j - 1] = lastValue;
                        lastValue = newValue;
                    }
                }
                if (i > 0) costs[s2.length] = lastValue;
            }
            return costs[s2.length];
        }

                <div class="field-group">

                            <ul class="autocomplete-list" id="autocompleteList${num}"></ul>

                        <button class="btn-camera" onclick="openCamera('name',${num})">📷</button>

                <div class="field-group"><label>📷 Заводской номер:</label>

                        <span id="serialSlash${num}" style="display:none;">/</span>

                        <button class="btn-camera" onclick="openCamera('serial',${num})" style="display:none;" id="serialBtn2_${num}">📷</button>
                        <button class="btn-voice voice-btn-serial-${num}" onclick="startVoiceInput(${num},'serialField')" title="Голосовой ввод номера" style="display:none;" id="serialVoiceBtn2_${num}">🎤</button>
                    </div>
                    <button class="btn-camera" onclick="openCamera('serial',${num})" id="serialBtn${num}">📷</button>
                    <button class="btn-voice voice-btn-serial-${num}" onclick="startVoiceInput(${num},'serialField')" title="Голосовой ввод номера" id="serialVoiceBtn${num}">🎤</button>
                    <div class="voice-status" id="voiceStatusSerial${num}"></div>
                    <img id="previewSerial${num}" class="preview"></div>
                <div class="field-group"><label>Адрес:</label><div class="field-row"><input type="text" id="addressField${num}" placeholder="Введите или выберите" list="addressList${num}" onchange="addAddressToList(this.value)"><datalist id="addressList${num}"></datalist></div></div>
                <div class="checkbox-row" id="akbRow${num}" style="display:none;"><input type="checkbox" id="akbCheck${num}"><label for="akbCheck${num}">Замена АКБ</label></div>
                <div class="field-group"><label>Примечание:</label><input type="text" id="noteField${num}" placeholder="Состояние..." style="width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;font-size:15px;"></div>`;
            if (num > 1) {
                var rb = document.createElement('button'); rb.className = 'btn-remove'; rb.textContent = '🗑️';
                rb.style.cssText = 'position:absolute;top:8px;right:8px;'; rb.onclick = function() { removeDevice(b.id); };
                b.appendChild(rb);
            }
            document.getElementById('devicesContainer').appendChild(b);
            updateAddressDatalists();
            renumberDevices();
            return b;
        }

        function addDevice() { deviceCounter++; createDeviceBlock(deviceCounter); }
        function removeDevice(id) { var b = document.getElementById(id); if (b) b.remove(); renumberDevices(); updateAddressDatalists(); }
        function renumberDevices() { document.querySelectorAll('.device-block').forEach(function(b,i){ b.id='device'+(i+1); var s=b.querySelector('.device-number'); if(s)s.textContent=i+1; }); deviceCounter=document.querySelectorAll('.device-block').length; }

        function checkType(deviceNum) {
            var typeVal = (document.getElementById('typeField' + deviceNum)?.value || '').toLowerCase();
            var akbRow = document.getElementById('akbRow' + deviceNum);
            if (akbRow) {
                if (typeVal.includes('тепловычислитель') || typeVal.includes('тепловыч')) {
                    akbRow.style.display = 'flex';
                } else {
                    akbRow.style.display = 'none';
                    if (document.getElementById('akbCheck' + deviceNum)) document.getElementById('akbCheck' + deviceNum).checked = false;
                }
            }
            checkDualSerial(deviceNum, typeVal);
        }

        function checkDualSerial(deviceNum, typeVal) {
            if (!typeVal) typeVal = (document.getElementById('typeField' + deviceNum)?.value || '').toLowerCase();
            var isDual = typeVal.includes('термометр сопротивления') || typeVal.includes('ктсп') || typeVal.includes('ктптр') || typeVal.includes('тспа');
            var slash = document.getElementById('serialSlash' + deviceNum);
            var field2 = document.getElementById('serialField2_' + deviceNum);
            var btn2 = document.getElementById('serialBtn2_' + deviceNum);
            var voiceBtn2 = document.getElementById('serialVoiceBtn2_' + deviceNum);
            var btn1 = document.getElementById('serialBtn' + deviceNum);
            var voiceBtn1 = document.getElementById('serialVoiceBtn' + deviceNum);
            if (isDual) {
                if (slash) slash.style.display = 'inline';
                if (field2) field2.style.display = 'block';
                if (btn2) btn2.style.display = 'block';
                if (voiceBtn2) voiceBtn2.style.display = 'block';
                if (btn1) btn1.style.display = 'none';
                if (voiceBtn1) voiceBtn1.style.display = 'none';
            } else {
                if (slash) slash.style.display = 'none';
                if (field2) field2.style.display = 'none';
                if (btn2) btn2.style.display = 'none';
                if (voiceBtn2) voiceBtn2.style.display = 'none';
                if (btn1) btn1.style.display = 'block';
                if (voiceBtn1) voiceBtn1.style.display = 'block';
            }
        }

        function suggestSecondSerial(deviceNum) {
            var typeVal = (document.getElementById('typeField' + deviceNum)?.value || '').toLowerCase();
            var isDual = typeVal.includes('термометр сопротивления') || typeVal.includes('ктсп') || typeVal.includes('ктптр') || typeVal.includes('тспа');
            if (!isDual) return;
            var s1 = document.getElementById('serialField' + deviceNum)?.value || '';
            var lastChar = s1.slice(-1).toUpperCase();
            var field2 = document.getElementById('serialField2_' + deviceNum);
            if (!field2 || !lastChar) return;
            if (lastChar === 'Х' || lastChar === 'X') {
                var sug = s1.slice(0, -1) + 'Г';
                if (field2.value === '' || field2.value === sug) field2.value = sug;
            } else if (lastChar === 'Г' || lastChar === 'G') {
                var sug = s1.slice(0, -1) + 'Х';
                if (field2.value === '' || field2.value === sug) field2.value = sug;
            }
        }

        function addAddressToList(address) {
            if (address && usedAddresses.indexOf(address) === -1) {
                usedAddresses.push(address);
                updateAddressDatalists();
            }
        }

        function updateAddressDatalists() {
            document.querySelectorAll('.device-block').forEach(function(b) {
                var n = b.id.replace('device', '');
                var list = document.getElementById('addressList' + n);
                if (list) {
                    list.innerHTML = '';
                    usedAddresses.forEach(function(a) { list.innerHTML += '<option value="' + esc(a) + '">'; });
                }
            });
        }

        function filterAutocomplete(deviceNum) {
            var input=document.getElementById('nameField'+deviceNum), list=document.getElementById('autocompleteList'+deviceNum);
            var filter=input.value.toLowerCase(), names=getTypeNames();
            list.innerHTML='';
            if(!filter&&names.length>0){ names.slice(0,20).forEach(function(n){ list.innerHTML+='<li data-name="'+esc(n)+'" onmousedown="selectAutocomplete('+deviceNum+',\''+esc(n)+'\')">'+esc(n)+'</li>'; }); list.style.display='block'; return; }
            var matches=names.filter(function(n){ return n.toLowerCase().includes(filter); });
            if(matches.length===0){ list.style.display='none'; return; }
            matches.slice(0,20).forEach(function(n){ list.innerHTML+='<li data-name="'+esc(n)+'" onmousedown="selectAutocomplete('+deviceNum+',\''+esc(n)+'\')">'+esc(n)+'</li>'; });
            list.style.display='block';
        }
        function selectAutocomplete(deviceNum,name){ document.getElementById('nameField'+deviceNum).value=name; document.getElementById('autocompleteList'+deviceNum).style.display='none'; var ft=findTypeByName(name); if(ft){document.getElementById('typeField'+deviceNum).value=ft; checkType(deviceNum);} }
        function hideAutocomplete(deviceNum){ setTimeout(function(){ document.getElementById('autocompleteList'+deviceNum).style.display='none'; },200); }

        function changeFrameSize(dw,dh){ var frame=document.getElementById('cameraFrame'); var w=frame.offsetWidth+dw*window.innerWidth/100; var h=frame.offsetHeight+dh; if(w<50)w=50; if(w>window.innerWidth*0.95)w=window.innerWidth*0.95; if(h<15)h=15; if(h>350)h=350; frame.style.width=w+'px'; frame.style.height=h+'px'; frame.style.left=((window.innerWidth-w)/2)+'px'; frameSettings.width=(w/window.innerWidth*100)+'%'; frameSettings.height=h+'px'; localStorage.setItem('cameraFrame',JSON.stringify(frameSettings)); }

        function openCamera(target,deviceNum){
            currentCameraTarget=target; currentCameraDevice=deviceNum;
            document.getElementById('cameraOverlay').style.display='block';
            var frame=document.getElementById('cameraFrame');
            frame.style.top=frameSettings.top; frame.style.width=frameSettings.width; frame.style.height=frameSettings.height;
            frame.style.left=((100-parseFloat(frameSettings.width))/2)+'%';
            var video=document.getElementById('cameraVideo');
            if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia){
                if(window._cachedStream){
                    cameraStream=window._cachedStream;
                    video.srcObject=cameraStream;
                    video.play();
                    return;
                }
                navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1920},height:{ideal:1080}}})
                    .then(function(s){ cameraStream=s; window._cachedStream=s; video.srcObject=s; video.play(); })
                    .catch(function(){ closeCamera(); fallbackToFileInput(target,deviceNum); });
            }else{ fallbackToFileInput(target,deviceNum); }
        }

        function captureFromCamera(){ if(!currentCameraTarget||!currentCameraDevice)return; var video=document.getElementById('cameraVideo'),frame=document.getElementById('cameraFrame'); var canvas=document.createElement('canvas');canvas.width=video.videoWidth;canvas.height=video.videoHeight; var ctx=canvas.getContext('2d');ctx.drawImage(video,0,0,canvas.width,canvas.height); var vr=video.getBoundingClientRect(),fr=frame.getBoundingClientRect(); var sx=Math.max(0,(fr.left-vr.left)*canvas.width/vr.width); var sy=Math.max(0,(fr.top-vr.top)*canvas.height/vr.height); var sw=Math.min(canvas.width-sx,fr.width*canvas.width/vr.width); var sh=Math.min(canvas.height-sy,fr.height*canvas.height/vr.height); var crop=document.createElement('canvas');crop.width=sw;crop.height=sh; crop.getContext('2d').drawImage(canvas,sx,sy,sw,sh,0,0,sw,sh); var dataUrl=crop.toDataURL('image/jpeg',0.9); document.getElementById('preview'+(currentCameraTarget==='name'?'Name':'Serial')+currentCameraDevice).src=dataUrl; document.getElementById('preview'+(currentCameraTarget==='name'?'Name':'Serial')+currentCameraDevice).style.display='block'; closeCamera(); recognizeText(dataUrl,currentCameraTarget,currentCameraDevice); }

        function closeCamera(){ document.getElementById('cameraOverlay').style.display='none'; document.getElementById('cameraVideo').srcObject=null; }

        function fallbackToFileInput(target,deviceNum){ closeCamera(); var inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.capture='environment'; inp.onchange=function(){ if(!inp.files||!inp.files[0])return; var reader=new FileReader(); reader.onload=function(e){ var img=new Image(); img.onload=function(){ var c=document.createElement('canvas');c.width=img.width;c.height=img.height*0.25; c.getContext('2d').drawImage(img,0,img.height*0.375,img.width,img.height*0.25,0,0,img.width,img.height*0.25); var url=c.toDataURL('image/jpeg',0.85); document.getElementById('preview'+(target==='name'?'Name':'Serial')+deviceNum).src=url; document.getElementById('preview'+(target==='name'?'Name':'Serial')+deviceNum).style.display='block'; recognizeText(url,target,deviceNum); };img.src=e.target.result; };reader.readAsDataURL(inp.files[0]); };inp.click(); }

        function findTypeByName(name){ if(!name)return''; var nc=name.toLowerCase().replace(/[^a-zа-я0-9]/g,''),best='',bestScore=0; typesData.forEach(function(r){var ref=(r[1]||r[0]||'').toLowerCase().replace(/[^a-zа-я0-9]/g,'');if(ref&&nc.includes(ref)&&ref.length>bestScore){bestScore=ref.length;best=r[2]||r[1]||'';}});return best; }
        function recognizeText(dataUrl,target,deviceNum){ setStatus('Распознавание...','loading'); Tesseract.recognize(dataUrl,'rus+eng',{tessedit_char_whitelist:'АБВГДЕЁЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯабвгдеёжзийклмнопрстуфхцчшщъыьэюяABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789№/-. ',logger:function(m){if(m.status==='recognizing text')setStatus('Распознавание: '+Math.round(m.progress*100)+'%','loading');}}).then(function(result){var text=cleanText(result.data.text);if(target==='name'){var nt=extractName(text);document.getElementById('nameField'+deviceNum).value=nt;var ft=findTypeByName(nt);if(ft){document.getElementById('typeField'+deviceNum).value=ft;checkType(deviceNum);setStatus('✅ '+nt,'success');}else setStatus('⚠️ Проверьте. Распознано: '+text.substring(0,40),'error');}else{var serial=extractSerial(text);document.getElementById('serialField'+deviceNum).value=serial;suggestSecondSerial(deviceNum);setStatus(serial?'✅ Номер: '+serial:'⚠️ Проверьте номер',serial?'success':'error');}}).catch(function(){setStatus('❌ Ошибка распознавания','error');}); }
        function cleanText(text){ var c=text.replace(/(\d)\.(\d)/g,'$1-$2').replace(/[^а-яА-ЯёЁa-zA-Z0-9№\-\s\.\/]/g,' ').replace(/\s+/g,' ').trim(); var fixes={'Ду':'ДУ','ду':'ДУ','Ne':'№','Nе':'№','No':'№','зав':'зав','Зав':'зав','KAPAT':'КАРАТ','Kapat':'КАРАТ','карат':'КАРАТ','Карат':'КАРАТ'}; return c.split(' ').map(function(w){return fixes[w]||w;}).join(' '); }
        function extractName(text){ var noSerial=text.replace(/зав\.?\s*[№Nn]\s*\d+/gi,'').replace(/[№Nn]\s*\d+/gi,''); var tc=noSerial.toLowerCase().replace(/[^a-zа-я0-9]/g,''),best='',bestScore=0; typesData.forEach(function(r){var ref=(r[1]||r[0]||'').trim();if(!ref)return;var fw=ref.split(/[\s\-]+/)[0].toLowerCase().replace(/[^a-zа-я0-9]/g,'');if(fw.length>=3&&tc.indexOf(fw)!==-1&&ref.length>bestScore){bestScore=ref.length;best=ref;}});return best||noSerial.replace(/\s+/g,' ').trim(); }
        function extractSerial(text){ var m=text.match(/(?:зав\.?\s*)?[№Nn]\s*[:=\-\s]*\s*(\d{3,})/i)||text.match(/\b(\d{4,})\b/); return m?m[1].replace(/[^\d]/g,''):''; }
        function addCompany(){ var name=prompt('Введите название компании:'); if(name&&name.trim()){document.getElementById('companySelect').innerHTML+='<option value="'+esc(name.trim())+'" selected>'+esc(name.trim())+'</option>';setStatus('Компания добавлена','success');} }

        function newAct() {
            if (confirm('Очистить все поля и начать новый акт?')) {
                document.getElementById('devicesContainer').innerHTML = '';
                deviceCounter = 0;
                usedAddresses = [];
                addDevice();
                setStatus('✅ Новый акт', 'success');
            }
        }

        function openActsList() {
            document.getElementById('actsModal').style.display = 'block';
            document.getElementById('actsList').innerHTML = 'Загрузка...';
            fetch(SCRIPT_URL + '?action=getActs')
                .then(r => r.json())
                .then(function(acts) {
                    var html = '';
                    var keys = Object.keys(acts).sort().reverse();
                    keys.forEach(function(actNum) {
                        var act = acts[actNum];
                        html += '<div class="act-item" onclick="loadAct(\'' + actNum + '\')">';
                        html += '<b>Акт №' + actNum + '</b> от ' + act.date + '<br>';
                        html += 'Компания: ' + act.company + ' | Приборов: ' + act.devices.length;
                        html += '</div>';
                    });
                    if (keys.length === 0) html = 'Нет сохранённых актов.';
                    document.getElementById('actsList').innerHTML = html;
                })
                .catch(function() { document.getElementById('actsList').innerHTML = 'Ошибка загрузки.'; });
        }

        function closeActsList() { document.getElementById('actsModal').style.display = 'none'; }

        function loadAct(actNum) {
            fetch(SCRIPT_URL + '?action=getAct&number=' + encodeURIComponent(actNum))
                .then(r => r.json())
                .then(function(act) {
                    if (act.error) { alert(act.error); return; }
                    
                    document.getElementById('devicesContainer').innerHTML = '';
                    deviceCounter = 0;
                    usedAddresses = [];
                    
                    act.devices.forEach(function(dev) {
                        deviceCounter++;
                        createDeviceBlock(deviceCounter);
                        document.getElementById('nameField' + deviceCounter).value = dev.name || '';
                        document.getElementById('typeField' + deviceCounter).value = dev.type || '';
                        document.getElementById('noteField' + deviceCounter).value = dev.note || '';
                        
                        if (dev.serial && String(dev.serial).includes('/')) {
                            var parts = String(dev.serial).split('/');
                            document.getElementById('serialField' + deviceCounter).value = parts[0] || '';
                            var s2 = document.getElementById('serialField2_' + deviceCounter);
                            if (s2) s2.value = parts[1] || '';
                            checkDualSerial(deviceCounter);
                        } else {
                            document.getElementById('serialField' + deviceCounter).value = dev.serial || '';
                        }
                        
                        if (dev.address) {
                            document.getElementById('addressField' + deviceCounter).value = dev.address;
                            if (usedAddresses.indexOf(dev.address) === -1) usedAddresses.push(dev.address);
                        }
                        
                        var typeVal = (dev.type || '').toLowerCase();
                        if (typeVal.includes('тепловычислитель') || typeVal.includes('тепловыч')) {
                            checkType(deviceCounter);
                            if (dev.akb) {
                                var akbCheck = document.getElementById('akbCheck' + deviceCounter);
                                if (akbCheck) akbCheck.checked = true;
                            }
                        }
                    });
                    
                    if (deviceCounter === 0) addDevice();
                    closeActsList();
                    setStatus('✅ Загружен акт №' + actNum, 'success');
                });
        }

        function submitAct(){
            var company=document.getElementById('companySelect').value,employee=document.getElementById('employeeSelect').value;
            if(!company||!employee){alert('Выберите компанию и принявшего');return;}
            var devices=[],allValid=true;
            document.querySelectorAll('.device-block').forEach(function(b){
                if (b.offsetParent === null) return;
                var n=b.id.replace('device','');
                var t=document.getElementById('typeField'+n)?.value.trim()||'',
                    nm=document.getElementById('nameField'+n)?.value.trim()||'',
                    s1=document.getElementById('serialField'+n)?.value.trim()||'',
                    s2=document.getElementById('serialField2_'+n)?.value.trim()||'',
                    addr=document.getElementById('addressField'+n)?.value.trim()||'',
                    akb=document.getElementById('akbCheck'+n)?.checked||false,
                    nt=document.getElementById('noteField'+n)?.value.trim()||'';
                var serial = s1;
                if (s2) serial += '/' + s2;
                if(!nm||!t||!s1){allValid=false;return;}
                devices.push({type:t,name:nm,serial:serial,address:addr,akb:akb,note:nt});
            });
            if(!allValid||!devices.length){alert('Заполните обязательные поля (Название, Тип, Заводской номер)');return;}
            var btn=document.getElementById('submitBtn');btn.disabled=true;btn.textContent='Отправка...';setStatus('Формирование и отправка...','loading');
            var now=new Date(),ds=('0'+now.getDate()).slice(-2)+'.'+('0'+(now.getMonth()+1)).slice(-2)+'.'+now.getFullYear();
            var form=document.createElement('form');form.method='POST';form.action=SCRIPT_URL;form.target='hiddenFrame';form.style.display='none';
            [{n:'date',v:ds},{n:'company',v:company},{n:'employee',v:employee},{n:'devices',v:JSON.stringify(devices)},{n:'email',v:settings.email}].forEach(function(f){var i=document.createElement('input');i.type='hidden';i.name=f.n;i.value=f.v;form.appendChild(i);});
            document.body.appendChild(form);form.submit();document.body.removeChild(form);
            setTimeout(function(){ setStatus('✅ Акт отправлен на '+settings.email,'success'); btn.textContent='📧 Сформировать акт и отправить'; btn.style.background='#FF5722'; btn.disabled=false; },2000);
        }
        function setStatus(msg,cls){var el=document.getElementById('status');el.textContent=msg;el.className='status';if(cls)el.classList.add(cls);}
        function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
    </script>
