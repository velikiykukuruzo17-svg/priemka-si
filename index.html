<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Приёмка СИ</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; padding: 15px; max-width: 500px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { font-size: 20px; color: #333; }
        .header p { font-size: 12px; color: #888; margin-top: 5px; }
        .field-group { margin-bottom: 12px; }
        .field-group label { display: block; font-size: 13px; font-weight: bold; color: #555; margin-bottom: 4px; }
        .field-row { display: flex; gap: 6px; }
        .field-row input, .field-row select { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; background: #fff; }
        .btn-camera { background: #4CAF50; color: #fff; border: none; border-radius: 8px; padding: 10px 14px; font-size: 18px; cursor: pointer; min-width: 46px; flex: 0 0 auto; }
        .btn-remove { background: #f44336; color: #fff; border: none; border-radius: 8px; padding: 10px 14px; font-size: 16px; cursor: pointer; min-width: 46px; flex: 0 0 auto; }
        .btn-add-device { width: 100%; background: #2196F3; color: #fff; border: none; border-radius: 8px; padding: 14px; font-size: 16px; cursor: pointer; margin: 10px 0; }
        .btn-submit { width: 100%; background: #FF5722; color: #fff; border: none; border-radius: 8px; padding: 16px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-submit:active { background: #E64A19; }
        .btn-submit:disabled { background: #ccc; }
        .device-block { background: #fff; border: 1px solid #e0e0e0; border-radius: 12px; padding: 12px; margin-bottom: 12px; position: relative; }
        .device-block .device-title { font-size: 14px; font-weight: bold; color: #333; margin-bottom: 8px; }
        .device-block .device-number { background: #eee; border-radius: 50%; width: 24px; height: 24px; display: inline-block; text-align: center; line-height: 24px; font-size: 13px; margin-right: 6px; }
        .preview { width: 100%; max-height: 150px; object-fit: contain; margin-top: 4px; border-radius: 8px; display: none; }
        .status { text-align: center; margin-top: 15px; font-size: 13px; color: #666; min-height: 20px; }
        .status.success { color: #4CAF50; }
        .status.error { color: #f44336; }
        .status.loading { color: #FF9800; }
        .hint { font-size: 11px; color: #999; margin-top: 3px; text-align: center; }
        .section-title { font-size: 14px; color: #888; margin: 15px 0 8px; border-top: 1px solid #ddd; padding-top: 12px; }
        input[type="file"] { display: none; }

        #cameraOverlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; touch-action: none; }
        #cameraVideo { width: 100%; height: 100%; object-fit: cover; }
        #cameraFrame { position: absolute; left: 10%; width: 80%; height: 100px; top: 40%; border: 3px solid #4CAF50; border-radius: 12px; box-shadow: 0 0 0 9999px rgba(0,0,0,0.55); }
        #cameraFrameLabel { position: absolute; top: -28px; left: 0; width: 100%; text-align: center; color: #fff; font-size: 13px; font-weight: bold; }
        #cameraControls { position: absolute; bottom: 130px; left: 0; width: 100%; display: flex; justify-content: center; gap: 10px; z-index: 10001; flex-wrap: wrap; }
        #cameraControls button { width: 42px; height: 42px; border-radius: 50%; border: 2px solid #fff; background: rgba(0,0,0,0.6); color: #fff; font-size: 18px; cursor: pointer; }
        #cameraCaptureBtn { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); width: 70px; height: 70px; background: #fff; border: 4px solid #4CAF50; border-radius: 50%; cursor: pointer; z-index: 10001; }
        #cameraCloseBtn { position: absolute; top: 20px; right: 20px; background: none; border: none; color: #fff; font-size: 30px; cursor: pointer; z-index: 10001; }
        .control-label { color: #fff; font-size: 10px; text-align: center; margin: 2px 0; }
    </style>
</head>
<body>
    <div class="header">
        <h1>📋 Приёмка средств измерений</h1>
        <p>ООО МС «ЦЕНТР ИЗМЕРЕНИЙ»</p>
    </div>

    <div class="field-group">
        <label>Компания-сдатчик:</label>
        <div class="field-row">
            <select id="companySelect"><option value="">-- Загрузка... --</option></select>
            <button class="btn-camera" onclick="addCompany()" title="Добавить" style="font-size:20px;">➕</button>
        </div>
    </div>

    <div class="field-group">
        <label>Кто принял:</label>
        <select id="employeeSelect"><option value="">-- Загрузка... --</option></select>
    </div>

    <div class="section-title">Приборы:</div>
    <div id="devicesContainer"></div>

    <button class="btn-add-device" onclick="addDevice()">➕ Добавить прибор</button>

    <button class="btn-submit" id="submitBtn" onclick="submitAct()">📧 Сформировать акт и отправить</button>
    <div class="hint">Письмо уйдёт на ms-tcentr@mail.ru</div>
    <div class="status" id="status"></div>

    <div id="cameraOverlay">
        <video id="cameraVideo" autoplay playsinline></video>
        <div id="cameraFrame"><div id="cameraFrameLabel">Поместите текст в рамку</div></div>
        <div id="cameraControls">
            <div style="text-align:center;">
                <div class="control-label">Высота</div>
                <button onclick="changeFrameSize(0, -15)">−</button>
                <button onclick="changeFrameSize(0, 15)">+</button>
            </div>
            <div style="text-align:center;">
                <div class="control-label">Шире</div>
                <button onclick="changeFrameSize(-8, 0)">◀</button>
                <button onclick="changeFrameSize(8, 0)">▶</button>
            </div>
            <div style="text-align:center;">
                <div class="control-label">Уже</div>
                <button onclick="changeFrameSize(-4, 0)">◁</button>
                <button onclick="changeFrameSize(4, 0)">▷</button>
            </div>
        </div>
        <button id="cameraCloseBtn" onclick="closeCamera()">✕</button>
        <button id="cameraCaptureBtn" onclick="captureFromCamera()"></button>
    </div>

    <iframe name="hiddenFrame" style="display:none;"></iframe>

    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script>
        var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw3PHbAcHAaLmC3cab1HOc7qEiz2erKGfwwQ5GeN2qZbfeid1UbZ3IeYRNA_McNLPuN/exec';
        var CSV_BASE = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQJLJVjVpDuLsNRjFg9j7X2NHcDtOgmo4lhiC_CTx2S0ox97Hne91SXQ7XtJJxb9OberlzYUrSXijw6/pub?output=csv&gid=';
        var GID_TYPES = '441822937';
        var GID_COMPANIES = '883764981';
        var GID_EMPLOYEES = '1294860374';

        var typesData = [];
        var deviceCounter = 0;
        var cameraStream = null;
        var currentCameraTarget = null;
        var currentCameraDevice = null;
        var frameDragging = false, frameStartY = 0, frameStartTop = 0;

        window.addEventListener('load', function() {
            setStatus('Загрузка справочников...', 'loading');
            loadDictionaries();
            addDevice();
            initFrameDrag();
        });

        function loadDictionaries() {
            Promise.all([
                fetch(CSV_BASE + GID_TYPES).then(r => r.text()),
                fetch(CSV_BASE + GID_COMPANIES).then(r => r.text()),
                fetch(CSV_BASE + GID_EMPLOYEES).then(r => r.text())
            ]).then(function(results) {
                typesData = parseCSV(results[0]);
                updateSelect('companySelect', parseCSV(results[1]), 0);
                updateSelect('employeeSelect', parseCSV(results[2]), 1);
                setStatus('✅ Готов к работе', 'success');
            }).catch(function(e) {
                setStatus('⚠️ Справочники не загружены', 'error');
            });
        }

        function parseCSV(csv) {
            var lines = csv.trim().split('\n');
            var result = [];
            for (var i = 1; i < lines.length; i++) {
                var cells = [], current = '', inQuotes = false;
                for (var j = 0; j < lines[i].length; j++) {
                    var ch = lines[i][j];
                    if (ch === '"') inQuotes = !inQuotes;
                    else if (ch === ',' && !inQuotes) { cells.push(current.trim()); current = ''; }
                    else current += ch;
                }
                cells.push(current.trim());
                if (cells.some(function(c) { return c.length > 0; })) result.push(cells);
            }
            return result;
        }

        function updateSelect(id, data, col) {
            var sel = document.getElementById(id);
            sel.innerHTML = '<option value="">-- Выберите --</option>';
            var names = [];
            data.forEach(function(row) {
                var val = row[col] || row[0] || '';
                if (val && names.indexOf(val) === -1) { names.push(val); sel.innerHTML += '<option value="' + esc(val) + '">' + esc(val) + '</option>'; }
            });
        }

        function addDevice() {
            deviceCounter++;
            var container = document.getElementById('devicesContainer');
            var block = document.createElement('div');
            block.className = 'device-block';
            block.id = 'device' + deviceCounter;
            block.innerHTML = `
                <div class="device-title"><span class="device-number">${deviceCounter}</span> Прибор</div>
                <div class="field-group">
                    <label>📷 Название:</label>
                    <div class="field-row">
                        <input type="text" id="nameField${deviceCounter}" placeholder="С рамкой или вручную">
                        <button class="btn-camera" onclick="openCamera('name', ${deviceCounter})">📷</button>
                    </div>
                    <img id="previewName${deviceCounter}" class="preview" alt="Фото названия">
                </div>
                <div class="field-group">
                    <label>Тип:</label>
                    <input type="text" id="typeField${deviceCounter}" placeholder="Авто или вручную" list="typeList" style="width:100%; padding:10px; border:1px solid #ddd; border-radius:8px; font-size:15px;">
                </div>
                <div class="field-group">
                    <label>📷 Заводской номер:</label>
                    <div class="field-row">
                        <input type="text" id="serialField${deviceCounter}" placeholder="С рамкой или вручную">
                        <button class="btn-camera" onclick="openCamera('serial', ${deviceCounter})">📷</button>
                    </div>
                    <img id="previewSerial${deviceCounter}" class="preview" alt="Фото номера">
                </div>
                <div class="field-group">
                    <label>Примечание:</label>
                    <input type="text" id="noteField${deviceCounter}" placeholder="Состояние..." style="width:100%; padding:10px; border:1px solid #ddd; border-radius:8px; font-size:15px;">
                </div>
            `;
            if (deviceCounter > 1) {
                var removeBtn = document.createElement('button');
                removeBtn.className = 'btn-remove';
                removeBtn.textContent = '🗑️';
                removeBtn.style.position = 'absolute';
                removeBtn.style.top = '8px'; removeBtn.style.right = '8px';
                removeBtn.onclick = function() { removeDevice(block.id); };
                block.appendChild(removeBtn);
            }
            container.appendChild(block);
            renumberDevices();
        }

        function removeDevice(id) { document.getElementById(id)?.remove(); renumberDevices(); }
        function renumberDevices() {
            document.querySelectorAll('.device-block').forEach(function(b, i) {
                b.id = 'device' + (i + 1);
                var s = b.querySelector('.device-number'); if (s) s.textContent = i + 1;
            });
            deviceCounter = document.querySelectorAll('.device-block').length;
        }

        function initFrameDrag() {
            var frame = document.getElementById('cameraFrame');
            frame.addEventListener('touchstart', function(e) {
                frameDragging = true; frameStartY = e.touches[0].clientY;
                frameStartTop = frame.getBoundingClientRect().top; e.preventDefault();
            });
            window.addEventListener('touchmove', function(e) {
                if (!frameDragging) return;
                var newTop = frameStartTop + (e.touches[0].clientY - frameStartY);
                if (newTop < 40) newTop = 40;
                if (newTop > window.innerHeight - frame.offsetHeight - 180) newTop = window.innerHeight - frame.offsetHeight - 180;
                frame.style.top = newTop + 'px';
                e.preventDefault();
            });
            window.addEventListener('touchend', function() { frameDragging = false; });
        }

        function changeFrameSize(dw, dh) {
            var frame = document.getElementById('cameraFrame');
            var w = frame.offsetWidth + dw * window.innerWidth / 100;
            var h = frame.offsetHeight + dh;
            if (w < 50) w = 50;
            if (w > window.innerWidth * 0.95) w = window.innerWidth * 0.95;
            if (h < 15) h = 15;
            if (h > 350) h = 350;
            frame.style.width = w + 'px';
            frame.style.height = h + 'px';
            frame.style.left = ((window.innerWidth - w) / 2) + 'px';
        }

        function openCamera(target, deviceNum) {
            currentCameraTarget = target; currentCameraDevice = deviceNum;
            document.getElementById('cameraOverlay').style.display = 'block';
            var frame = document.getElementById('cameraFrame');
            frame.style.top = '35%'; frame.style.width = '80%'; frame.style.height = '80px'; frame.style.left = '10%';
            var video = document.getElementById('cameraVideo');
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } } })
                    .then(function(stream) { cameraStream = stream; video.srcObject = stream; video.play(); })
                    .catch(function() { closeCamera(); fallbackToFileInput(target, deviceNum); });
            } else { fallbackToFileInput(target, deviceNum); }
        }

        function captureFromCamera() {
            if (!currentCameraTarget || !currentCameraDevice) return;
            var video = document.getElementById('cameraVideo');
            var frame = document.getElementById('cameraFrame');
            var canvas = document.createElement('canvas');
            canvas.width = video.videoWidth; canvas.height = video.videoHeight;
            var ctx = canvas.getContext('2d'); ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            var vr = video.getBoundingClientRect(), fr = frame.getBoundingClientRect();
            var sx = Math.max(0, (fr.left - vr.left) * canvas.width / vr.width);
            var sy = Math.max(0, (fr.top - vr.top) * canvas.height / vr.height);
            var sw = Math.min(canvas.width - sx, fr.width * canvas.width / vr.width);
            var sh = Math.min(canvas.height - sy, fr.height * canvas.height / vr.height);
            var crop = document.createElement('canvas'); crop.width = sw; crop.height = sh;
            crop.getContext('2d').drawImage(canvas, sx, sy, sw, sh, 0, 0, sw, sh);
            var dataUrl = crop.toDataURL('image/jpeg', 0.9);
            document.getElementById('preview' + (currentCameraTarget === 'name' ? 'Name' : 'Serial') + currentCameraDevice).src = dataUrl;
            document.getElementById('preview' + (currentCameraTarget === 'name' ? 'Name' : 'Serial') + currentCameraDevice).style.display = 'block';
            closeCamera();
            recognizeText(dataUrl, currentCameraTarget, currentCameraDevice);
        }

        function closeCamera() {
            if (cameraStream) { cameraStream.getTracks().forEach(function(t) { t.stop(); }); cameraStream = null; }
            document.getElementById('cameraOverlay').style.display = 'none';
        }

        function fallbackToFileInput(target, deviceNum) {
            closeCamera();
            var inp = document.createElement('input');
            inp.type = 'file'; inp.accept = 'image/*'; inp.capture = 'environment';
            inp.onchange = function() {
                if (!inp.files || !inp.files[0]) return;
                var reader = new FileReader();
                reader.onload = function(e) {
                    var img = new Image();
                    img.onload = function() {
                        var c = document.createElement('canvas');
                        c.width = img.width; c.height = img.height * 0.25;
                        c.getContext('2d').drawImage(img, 0, img.height * 0.375, img.width, img.height * 0.25, 0, 0, img.width, img.height * 0.25);
                        var url = c.toDataURL('image/jpeg', 0.85);
                        document.getElementById('preview' + (target === 'name' ? 'Name' : 'Serial') + deviceNum).src = url;
                        document.getElementById('preview' + (target === 'name' ? 'Name' : 'Serial') + deviceNum).style.display = 'block';
                        recognizeText(url, target, deviceNum);
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(inp.files[0]);
            };
            inp.click();
        }

        function findTypeByName(name) {
            if (!name) return '';
            var nc = name.toLowerCase().replace(/[^a-zа-я0-9]/g, '');
            var best = '', bestScore = 0;
            typesData.forEach(function(row) {
                var ref = (row[1] || row[0] || '').toLowerCase().replace(/[^a-zа-я0-9]/g, '');
                if (ref && nc.includes(ref) && ref.length > bestScore) { bestScore = ref.length; best = row[2] || row[1] || ''; }
            });
            return best;
        }

        function recognizeText(dataUrl, target, deviceNum) {
            setStatus('Распознавание...', 'loading');
            Tesseract.recognize(dataUrl, 'rus+eng', {
                tessedit_char_whitelist: 'АБВГДЕЁЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯабвгдеёжзийклмнопрстуфхцчшщъыьэюяABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789№/-. ',
                logger: function(m) { if (m.status === 'recognizing text') setStatus('Распознавание: ' + Math.round(m.progress * 100) + '%', 'loading'); }
            }).then(function(result) {
                var text = cleanText(result.data.text);
                if (target === 'name') {
                    var nameText = extractName(text);
                    document.getElementById('nameField' + deviceNum).value = nameText;
                    var ft = findTypeByName(nameText);
                    if (ft) { document.getElementById('typeField' + deviceNum).value = ft; setStatus('✅ ' + nameText, 'success'); }
                    else setStatus('⚠️ Проверьте. Распознано: ' + text.substring(0, 40), 'error');
                } else {
                    var serial = extractSerial(text);
                    document.getElementById('serialField' + deviceNum).value = serial;
                    setStatus(serial ? '✅ Номер: ' + serial : '⚠️ Проверьте номер', serial ? 'success' : 'error');
                }
            }).catch(function() { setStatus('❌ Ошибка распознавания', 'error'); });
        }

        function cleanText(text) {
            var c = text.replace(/(\d)\.(\d)/g, '$1-$2').replace(/[^а-яА-ЯёЁa-zA-Z0-9№\-\s\.\/]/g, ' ').replace(/\s+/g, ' ').trim();
            var fixes = {'Ду':'ДУ','ду':'ДУ','Ne':'№','Nе':'№','No':'№','зав':'зав','Зав':'зав','KAPAT':'КАРАТ','Kapat':'КАРАТ','карат':'КАРАТ','Карат':'КАРАТ'};
            return c.split(' ').map(function(w) { return fixes[w] || w; }).join(' ');
        }

        function extractName(text) {
            var noSerial = text.replace(/зав\.?\s*[№Nn]\s*\d+/gi, '').replace(/[№Nn]\s*\d+/gi, '');
            var tc = noSerial.toLowerCase().replace(/[^a-zа-я0-9]/g, '');
            var best = '', bestScore = 0;
            typesData.forEach(function(row) {
                var ref = (row[1] || row[0] || '').trim();
                if (!ref) return;
                var fw = ref.split(/[\s\-]+/)[0].toLowerCase().replace(/[^a-zа-я0-9]/g, '');
                if (fw.length >= 3 && tc.indexOf(fw) !== -1 && ref.length > bestScore) { bestScore = ref.length; best = ref; }
            });
            return best || noSerial.replace(/\s+/g, ' ').trim();
        }

        function extractSerial(text) {
            var m = text.match(/(?:зав\.?\s*)?[№Nn]\s*[:=\-\s]*\s*(\d{3,})/i) || text.match(/\b(\d{4,})\b/);
            return m ? m[1].replace(/[^\d]/g, '') : '';
        }

        function addCompany() {
            var name = prompt('Введите название компании:');
            if (name && name.trim()) {
                document.getElementById('companySelect').innerHTML += '<option value="' + esc(name.trim()) + '" selected>' + esc(name.trim()) + '</option>';
                setStatus('Компания добавлена', 'success');
            }
        }

        function submitAct() {
            var company = document.getElementById('companySelect').value;
            var employee = document.getElementById('employeeSelect').value;
            if (!company || !employee) { alert('Выберите компанию и принявшего'); return; }
            var devices = [], allValid = true;
            document.querySelectorAll('.device-block').forEach(function(b) {
                var n = b.id.replace('device', '');
                var t = document.getElementById('typeField' + n)?.value.trim() || '';
                var nm = document.getElementById('nameField' + n)?.value.trim() || '';
                var s = document.getElementById('serialField' + n)?.value.trim() || '';
                var nt = document.getElementById('noteField' + n)?.value.trim() || '';
                if (!nm || !t || !s) { allValid = false; return; }
                devices.push({ type: t, name: nm, serial: s, note: nt });
            });
            if (!allValid || !devices.length) { alert('Заполните все поля'); return; }
            var btn = document.getElementById('submitBtn');
            btn.disabled = true; btn.textContent = 'Отправка...';
            setStatus('Формирование и отправка...', 'loading');
            var now = new Date();
            var ds = ('0' + now.getDate()).slice(-2) + '.' + ('0' + (now.getMonth() + 1)).slice(-2) + '.' + now.getFullYear();
            var form = document.createElement('form');
            form.method = 'POST'; form.action = SCRIPT_URL; form.target = 'hiddenFrame'; form.style.display = 'none';
            [{n:'date',v:ds},{n:'company',v:company},{n:'employee',v:employee},{n:'devices',v:JSON.stringify(devices)}].forEach(function(f) {
                var i = document.createElement('input'); i.type = 'hidden'; i.name = f.n; i.value = f.v; form.appendChild(i);
            });
            document.body.appendChild(form); form.submit(); document.body.removeChild(form);
            setTimeout(function() { setStatus('✅ Акт отправлен', 'success'); btn.textContent = '✓ Отправлено'; btn.style.background = '#4CAF50'; }, 2000);
        }

        function setStatus(msg, cls) {
            var el = document.getElementById('status'); el.textContent = msg; el.className = 'status';
            if (cls) el.classList.add(cls);
        }
        function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
    </script>
</body>
</html>
