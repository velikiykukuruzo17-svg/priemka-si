<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Приёмка СИ</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; padding: 15px; max-width: 500px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .header h1 { font-size: 20px; color: #333; }
        .header p { font-size: 12px; color: #888; margin-top: 5px; }
        .btn-settings { background: none; border: none; font-size: 24px; cursor: pointer; }
        .field-group { margin-bottom: 12px; }
        .field-group label { display: block; font-size: 13px; font-weight: bold; color: #555; margin-bottom: 4px; }
        .field-row { display: flex; gap: 6px; }
        .field-row input, .field-row select { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; background: #fff; }
        .btn-camera { background: #4CAF50; color: #fff; border: none; border-radius: 8px; padding: 10px 14px; font-size: 18px; cursor: pointer; min-width: 46px; flex: 0 0 auto; }
        .btn-remove { background: #f44336; color: #fff; border: none; border-radius: 8px; padding: 10px 14px; font-size: 16px; cursor: pointer; min-width: 46px; flex: 0 0 auto; }
        .btn-add-device { width: 100%; background: #2196F3; color: #fff; border: none; border-radius: 8px; padding: 14px; font-size: 16px; cursor: pointer; margin: 10px 0; }
        .btn-submit { width: 100%; background: #FF5722; color: #fff; border: none; border-radius: 8px; padding: 16px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-submit:disabled { background: #ccc; }
        .device-block { background: #fff; border: 1px solid #e0e0e0; border-radius: 12px; padding: 12px; margin-bottom: 12px; position: relative; }
        .device-title { font-size: 14px; font-weight: bold; color: #333; margin-bottom: 8px; }
        .device-number { background: #eee; border-radius: 50%; width: 24px; height: 24px; display: inline-block; text-align: center; line-height: 24px; font-size: 13px; margin-right: 6px; }
        .preview { width: 100%; max-height: 150px; object-fit: contain; margin-top: 4px; border-radius: 8px; display: none; }
        .status { text-align: center; margin-top: 15px; font-size: 13px; color: #666; min-height: 20px; }
        .status.success { color: #4CAF50; } .status.error { color: #f44336; } .status.loading { color: #FF9800; }
        .hint { font-size: 11px; color: #999; margin-top: 3px; text-align: center; }
        .section-title { font-size: 14px; color: #888; margin: 15px 0 8px; border-top: 1px solid #ddd; padding-top: 12px; }
        input[type="file"] { display: none; }

        .autocomplete-wrap { position: relative; flex: 1; }
        .autocomplete-list { position: absolute; top: 100%; left: 0; right: 0; max-height: 200px; overflow-y: auto; background: #fff; border: 1px solid #ddd; border-radius: 0 0 8px 8px; z-index: 100; display: none; list-style: none; }
        .autocomplete-list li { padding: 10px; cursor: pointer; font-size: 14px; border-bottom: 1px solid #eee; }
        .autocomplete-list li:hover, .autocomplete-list li.active { background: #E3F2FD; }
        .autocomplete-list li:last-child { border-bottom: none; }
        #settingsPanel { display: none; background: #fff; border: 1px solid #ddd; border-radius: 12px; padding: 15px; margin-bottom: 15px; }
        #settingsPanel h3 { margin-bottom: 12px; }
        #settingsPanel input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; margin-bottom: 8px; }

        #cameraModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; }
        #cameraVideo { width: 100%; height: 100%; object-fit: cover; }
        #cameraFrame { position: absolute; border: 3px solid #4CAF50; background: rgba(76,175,80,0.08); left: 50%; top: 50%; transform: translate(-50%, -50%); }
        #cameraFrame::after { content: 'Наведите рамку на шильду'; position: absolute; top: -28px; left: 50%; transform: translateX(-50%); color: #fff; font-size: 14px; background: rgba(0,0,0,0.7); padding: 4px 12px; border-radius: 12px; white-space: nowrap; }
        .camera-controls { position: absolute; bottom: 40px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 16px; z-index: 10001; }
        .camera-controls button { width: 60px; height: 60px; border-radius: 50%; border: 3px solid #fff; background: rgba(0,0,0,0.5); color: #fff; font-size: 26px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .camera-controls button:active { background: rgba(255,255,255,0.3); }
        .btn-photo { background: #fff !important; border-color: #4CAF50 !important; color: #4CAF50 !important; width: 80px !important; height: 80px !important; font-size: 18px !important; font-weight: bold; }
        .btn-close-cam { position: absolute; top: 20px; right: 20px; width: 48px; height: 48px; border-radius: 50%; background: rgba(255,255,255,0.3); border: none; color: #fff; font-size: 28px; cursor: pointer; z-index: 10001; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>
    <div class="header">
        <div><h1>📋 Приёмка средств измерений</h1><p>ООО МС «ЦЕНТР ИЗМЕРЕНИЙ»</p></div>
        <button class="btn-settings" onclick="toggleSettings()" title="Настройки">⚙️</button>
    </div>

    <div id="settingsPanel">
        <h3>⚙️ Настройки</h3>
        <label>Email для отправки актов:</label>
        <input type="email" id="settingsEmail" placeholder="ms-tcentr@mail.ru">
        <button onclick="saveSettings()" style="background:#4CAF50;color:#fff;border:none;padding:12px 24px;border-radius:8px;font-size:16px;cursor:pointer;">💾 Сохранить</button>
    </div>

    <div class="field-group">
        <label>Компания-сдатчик:</label>
        <div class="field-row">
            <select id="companySelect"><option value="">-- Загрузка... --</option></select>
            <button class="btn-camera" onclick="addCompany()" title="Добавить" style="font-size:20px;">➕</button>
        </div>
    </div>

    <div class="field-group"><label>Кто принял:</label><select id="employeeSelect"><option value="">-- Загрузка... --</option></select></div>
    <div class="section-title">Приборы:</div>
    <div id="devicesContainer"></div>
    <button class="btn-add-device" onclick="addDevice()">➕ Добавить прибор</button>
    <button class="btn-submit" id="submitBtn" onclick="submitAct()">📧 Сформировать акт и отправить</button>
    <div class="hint">Письмо уйдёт на <span id="statusEmail">ms-tcentr@mail.ru</span></div>
    <div class="status" id="status"></div>

    <div id="cameraModal">
        <video id="cameraVideo" autoplay playsinline></video>
        <div id="cameraFrame"></div>
        <button class="btn-close-cam" onclick="closeCamera()">✕</button>
        <div class="camera-controls">
            <button onclick="resizeFrame(-15,0)" title="Уже">↔−</button>
            <button onclick="resizeFrame(0,-15)" title="Ниже">↕−</button>
            <button class="btn-photo" onclick="takePhoto()">📷</button>
            <button onclick="resizeFrame(0,15)" title="Выше">↕+</button>
            <button onclick="resizeFrame(15,0)" title="Шире">↔+</button>
        </div>
    </div>
    <iframe name="hiddenFrame" style="display:none;"></iframe>

    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script>
        var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzfiwWvMDYCcvXfbwg0xtiN1yVdYrX7ZlHvLvk7hmqzxvxLMWDhoDdzHghpwm3YSDOW/exec';
        var CSV_BASE = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQJLJVjVpDuLsNRjFg9j7X2NHcDtOgmo4lhiC_CTx2S0ox97Hne91SXQ7XtJJxb9OberlzYUrSXijw6/pub?output=csv&gid=';
        var GID_TYPES = '441822937', GID_COMPANIES = '883764981', GID_EMPLOYEES = '1294860374';
        var typesData = [], deviceCounter = 0, cameraStream = null, currentCameraTarget = null, currentCameraDevice = null;
        var frameSettings = JSON.parse(localStorage.getItem('cameraFrame') || '{"width":"80%","height":"100px"}');
        var settings = JSON.parse(localStorage.getItem('appSettings') || '{"email":"ms-tcentr@mail.ru"}');
        var CACHE_KEY = 'dictionariesCache';
        var CACHE_TTL = 30 * 60 * 1000;

        window.addEventListener('load', function() {
            document.getElementById('settingsEmail').value = settings.email;
            document.getElementById('statusEmail').textContent = settings.email;
            setStatus('Загрузка...', 'loading');
            loadDictionaries();
            addDevice();
        });

        function toggleSettings() {
            var p = document.getElementById('settingsPanel');
            p.style.display = p.style.display === 'none' ? 'block' : 'none';
        }
        function saveSettings() {
            settings.email = document.getElementById('settingsEmail').value;
            localStorage.setItem('appSettings', JSON.stringify(settings));
            document.getElementById('statusEmail').textContent = settings.email;
            document.getElementById('settingsPanel').style.display = 'none';
            setStatus('✅ Настройки сохранены', 'success');
        }

        function loadDictionaries() {
            var cached = localStorage.getItem(CACHE_KEY);
            if (cached) {
                try {
                    var data = JSON.parse(cached);
                    if (data.timestamp && (Date.now() - data.timestamp) < CACHE_TTL) {
                        typesData = data.types;
                        updateSelect('companySelect', data.companies, 0);
                        updateSelect('employeeSelect', data.employees, 1);
                        setStatus('✅ Готово', 'success');
                        fetchDictionaries(false);
                        return;
                    }
                } catch(e) {}
            }
            fetchDictionaries(true);
        }

        function fetchDictionaries(showStatus) {
            if (showStatus) setStatus('Загрузка справочников...', 'loading');
            Promise.all([
                fetch(CSV_BASE + GID_TYPES).then(r => r.text()),
                fetch(CSV_BASE + GID_COMPANIES).then(r => r.text()),
                fetch(CSV_BASE + GID_EMPLOYEES).then(r => r.text())
            ]).then(function(results) {
                typesData = parseCSV(results[0]);
                var companies = parseCSV(results[1]);
                var employees = parseCSV(results[2]);
                updateSelect('companySelect', companies, 0);
                updateSelect('employeeSelect', employees, 1);
                localStorage.setItem(CACHE_KEY, JSON.stringify({ timestamp: Date.now(), types: typesData, companies: companies, employees: employees }));
                if (showStatus) setStatus('✅ Готов к работе', 'success');
            }).catch(function() { if (showStatus) setStatus('⚠️ Ошибка справочников', 'error'); });
        }

        function parseCSV(csv) {
            var lines = csv.trim().split('\n'), result = [];
            for (var i = 1; i < lines.length; i++) {
                var cells = [], cur = '', q = false;
                for (var j = 0; j < lines[i].length; j++) {
                    var c = lines[i][j];
                    if (c === '"') q = !q;
                    else if (c === ',' && !q) { cells.push(cur.trim()); cur = ''; }
                    else cur += c;
                }
                cells.push(cur.trim());
                if (cells.some(function(c) { return c.length > 0; })) result.push(cells);
            }
            return result;
        }

        function updateSelect(id, data, col) {
            var sel = document.getElementById(id); sel.innerHTML = '<option value="">-- Выберите --</option>';
            var names = [];
            data.forEach(function(r) { var v = r[col] || r[0] || ''; if (v && names.indexOf(v) === -1) { names.push(v); sel.innerHTML += '<option value="' + esc(v) + '">' + esc(v) + '</option>'; } });
        }

        function getTypeNames() {
            var names = [];
            typesData.forEach(function(r) { var n = r[1] || r[0] || ''; if (n && names.indexOf(n) === -1) names.push(n); });
            return names;
        }

        function addDevice() {
            deviceCounter++;
            var b = document.createElement('div'); b.className = 'device-block'; b.id = 'device' + deviceCounter;
            b.innerHTML = `<div class="device-title"><span class="device-number">${deviceCounter}</span> Прибор</div>
                <div class="field-group"><label>📷 Название:</label><div class="field-row"><div class="autocomplete-wrap"><input type="text" id="nameField${deviceCounter}" placeholder="Введите или выберите" autocomplete="off" oninput="filterAutocomplete(${deviceCounter})" onfocus="filterAutocomplete(${deviceCounter})" onblur="hideAutocomplete(${deviceCounter})"><ul class="autocomplete-list" id="autocompleteList${deviceCounter}"></ul></div><button class="btn-camera" onclick="openCamera('name',${deviceCounter})">📷</button></div><img id="previewName${deviceCounter}" class="preview"></div>
                <div class="field-group"><label>Тип:</label><input type="text" id="typeField${deviceCounter}" placeholder="Авто или вручную" list="typeList" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;font-size:15px;"></div>
                <div class="field-group"><label>📷 Заводской номер:</label><div class="field-row"><input type="text" id="serialField${deviceCounter}" placeholder="С рамкой или вручную"><button class="btn-camera" onclick="openCamera('serial',${deviceCounter})">📷</button></div><img id="previewSerial${deviceCounter}" class="preview"></div>
                <div class="field-group"><label>Примечание:</label><input type="text" id="noteField${deviceCounter}" placeholder="Состояние..." style="width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;font-size:15px;"></div>`;
            if (deviceCounter > 1) {
                var rb = document.createElement('button'); rb.className = 'btn-remove'; rb.textContent = '🗑️'; rb.style.cssText = 'position:absolute;top:8px;right:8px;';
                rb.onclick = function() { b.remove(); renumberDevices(); }; b.appendChild(rb);
            }
            document.getElementById('devicesContainer').appendChild(b); renumberDevices();
        }

        function removeDevice(id) { var b = document.getElementById(id); if (b) b.remove(); renumberDevices(); }
        function renumberDevices() {
            var blocks = document.querySelectorAll('.device-block'); deviceCounter = blocks.length;
            blocks.forEach(function(b, i) { b.id = 'device' + (i+1); var s = b.querySelector('.device-number'); if (s) s.textContent = i+1; });
        }

        function filterAutocomplete(deviceNum) {
            var input = document.getElementById('nameField' + deviceNum), list = document.getElementById('autocompleteList' + deviceNum);
            var filter = input.value.toLowerCase(), names = getTypeNames();
            list.innerHTML = '';
            if (!filter && names.length > 0) { names.slice(0,20).forEach(function(n) { list.innerHTML += '<li data-name="'+esc(n)+'" onmousedown="selectAutocomplete('+deviceNum+',\''+esc(n)+'\')">'+esc(n)+'</li>'; }); list.style.display = 'block'; return; }
            var matches = names.filter(function(n) { return n.toLowerCase().includes(filter); });
            if (matches.length === 0) { list.style.display = 'none'; return; }
            matches.slice(0,20).forEach(function(n) { list.innerHTML += '<li data-name="'+esc(n)+'" onmousedown="selectAutocomplete('+deviceNum+',\''+esc(n)+'\')">'+esc(n)+'</li>'; });
            list.style.display = 'block';
        }

        function selectAutocomplete(deviceNum, name) {
            document.getElementById('nameField' + deviceNum).value = name;
            document.getElementById('autocompleteList' + deviceNum).style.display = 'none';
            var ft = findTypeByName(name); if (ft) document.getElementById('typeField' + deviceNum).value = ft;
        }

        function hideAutocomplete(deviceNum) { setTimeout(function() { document.getElementById('autocompleteList' + deviceNum).style.display = 'none'; }, 200); }

        // КАМЕРА
        function openCamera(target, deviceNum) {
            currentCameraTarget = target; currentCameraDevice = deviceNum;
            document.getElementById('cameraModal').style.display = 'block';
            var frame = document.getElementById('cameraFrame');
            frame.style.width = frameSettings.width;
            frame.style.height = frameSettings.height;
            // Центрируем рамку
            frame.style.left = '50%';
            frame.style.top = '50%';
            frame.style.transform = 'translate(-50%, -50%)';
            
            navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } }).then(function(stream) {
                cameraStream = stream;
                document.getElementById('cameraVideo').srcObject = stream;
            }).catch(function() { closeCamera(); });
        }

        function closeCamera() {
            document.getElementById('cameraModal').style.display = 'none';
            if (cameraStream) { cameraStream.getTracks().forEach(function(t) { t.stop(); }); cameraStream = null; }
        }

        function resizeFrame(dw, dh) {
            var frame = document.getElementById('cameraFrame');
            var w = parseInt(frame.style.width) || 80;
            var h = parseInt(frame.style.height) || 100;
            w = Math.max(15, Math.min(95, w + dw/2));
            h = Math.max(30, Math.min(500, h + dh/2));
            frame.style.width = w + '%';
            frame.style.height = h + 'px';
            // Оставляем рамку по центру
            frame.style.left = '50%';
            frame.style.top = '50%';
            frame.style.transform = 'translate(-50%, -50%)';
            frameSettings.width = frame.style.width;
            frameSettings.height = frame.style.height;
            localStorage.setItem('cameraFrame', JSON.stringify(frameSettings));
        }

        function takePhoto() {
            var video = document.getElementById('cameraVideo'), canvas = document.createElement('canvas');
            var frame = document.getElementById('cameraFrame');
            var fr = frame.getBoundingClientRect(), vr = video.getBoundingClientRect();
            var sx = Math.max(0, (fr.left - vr.left) * (video.videoWidth / vr.width));
            var sy = Math.max(0, (fr.top - vr.top) * (video.videoHeight / vr.height));
            var sw = Math.min(video.videoWidth - sx, fr.width * (video.videoWidth / vr.width));
            var sh = Math.min(video.videoHeight - sy, fr.height * (video.videoHeight / vr.height));
            
            var tempCanvas = document.createElement('canvas');
            tempCanvas.width = sw; tempCanvas.height = sh;
            tempCanvas.getContext('2d').drawImage(video, sx, sy, sw, sh, 0, 0, sw, sh);
            
            // Апскейл до 2000px + контраст
            var scale = 2000 / sw;
            canvas.width = 2000; canvas.height = Math.floor(sh * scale);
            var ctx = canvas.getContext('2d');
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';
            ctx.drawImage(tempCanvas, 0, 0, canvas.width, canvas.height);
            
            // Повышаем контраст
            var imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            var data = imageData.data;
            for (var i = 0; i < data.length; i += 4) {
                var gray = 0.299 * data[i] + 0.587 * data[i+1] + 0.114 * data[i+2];
                gray = (gray - 128) * 2.5 + 128;
                if (gray > 255) gray = 255;
                if (gray < 0) gray = 0;
                gray = gray > 130 ? 255 : 0;
                data[i] = data[i+1] = data[i+2] = gray;
            }
            ctx.putImageData(imageData, 0, 0);
            
            var dataUrl = canvas.toDataURL('image/jpeg', 0.95);
            closeCamera();
            var preview = document.getElementById('preview' + (currentCameraTarget === 'name' ? 'Name' : 'Serial') + currentCameraDevice);
            preview.src = dataUrl; preview.style.display = 'block';
            recognizeText(dataUrl, currentCameraTarget, currentCameraDevice);
        }

        function recognizeText(dataUrl, target, deviceNum) {
            setStatus('Распознавание...', 'loading');
            Tesseract.recognize(dataUrl, 'rus+eng', {
                tessedit_char_whitelist: 'АБВГДЕЁЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯабвгдеёжзийклмнопрстуфхцчшщъыьэюяABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789№/-. ',
                logger: function(m) { if (m.status === 'recognizing text') setStatus('Распознавание: ' + Math.round(m.progress * 100) + '%', 'loading'); }
            }).then(function(result) {
                var text = cleanText(result.data.text);
                if (target === 'name') {
                    var nameText = extractName(text);
                    document.getElementById('nameField' + deviceNum).value = nameText;
                    var ft = findTypeByName(nameText);
                    if (ft) { document.getElementById('typeField' + deviceNum).value = ft; setStatus('✅ Прибор ' + deviceNum + ': ' + nameText, 'success'); }
                    else setStatus('⚠️ Прибор ' + deviceNum + ': проверьте название', 'error');
                } else {
                    var serial = extractSerial(text);
                    document.getElementById('serialField' + deviceNum).value = serial;
                    setStatus(serial ? '✅ Прибор ' + deviceNum + ', номер: ' + serial : '⚠️ Прибор ' + deviceNum + ': проверьте номер', serial ? 'success' : 'error');
                }
            }).catch(function() { setStatus('❌ Ошибка распознавания', 'error'); });
        }

        function findTypeByName(name) {
            if (!name) return '';
            var nc = name.toLowerCase().replace(/[^a-zа-я0-9]/g, '');
            var best = '', bestScore = 0;
            typesData.forEach(function(r) { var ref = (r[1]||r[0]||'').toLowerCase().replace(/[^a-zа-я0-9]/g,''); if (ref && nc.includes(ref) && ref.length > bestScore) { bestScore = ref.length; best = r[2]||r[1]||''; } });
            return best;
        }

        function cleanText(text) {
            var cleaned = text.replace(/[^а-яА-ЯёЁa-zA-Z0-9№\-\s\.\/]/g, ' ').replace(/\s+/g, ' ').trim();
            var fixes = {'Ду':'ДУ','ду':'ДУ','Ne':'№','Nе':'№','No':'№','зав':'зав','Зав':'зав','KAPAT':'КАРАТ','Kapat':'КАРАТ','карат':'КАРАТ','Карат':'КАРАТ'};
            var words = cleaned.split(' ');
            for (var i = 0; i < words.length; i++) { if (fixes[words[i]]) words[i] = fixes[words[i]]; }
            return words.join(' ');
        }

        function extractName(text) {
            var noSerial = text.replace(/зав\.?\s*[№Nn]\s*\d+/gi, '').replace(/[№Nn]\s*\d+/gi, '');
            var textClean = noSerial.toLowerCase().replace(/[^a-zа-я0-9]/g, '');
            var bestMatch = '', bestScore = 0;
            typesData.forEach(function(r) { var refName = (r[1]||r[0]||'').trim(); if (!refName) return; var firstWord = refName.split(/[\s\-]+/)[0].toLowerCase().replace(/[^a-zа-я0-9]/g,''); if (firstWord.length >= 3 && textClean.indexOf(firstWord) !== -1) { if (refName.length > bestScore) { bestScore = refName.length; bestMatch = refName; } } });
            return bestMatch || noSerial.replace(/\s+/g, ' ').trim();
        }

        function extractSerial(text) {
            var m = text.match(/зав\.?\s*[№Nn]\s*(\d[\d\s\-\.\/]*\d)/i) || text.match(/[№Nn]\s*(\d[\d\s\-\.\/]*\d)/i) || text.match(/\b(\d{4,})\b/);
            return m ? m[1].replace(/[^\d]/g, '') : '';
        }

        function addCompany() {
            var name = prompt('Введите название компании:');
            if (name && name.trim()) { document.getElementById('companySelect').innerHTML += '<option value="'+esc(name.trim())+'" selected>'+esc(name.trim())+'</option>'; setStatus('Компания добавлена', 'success'); }
        }

        function submitAct() {
            var company = document.getElementById('companySelect').value, employee = document.getElementById('employeeSelect').value;
            if (!company || !employee) { alert('Выберите компанию и принявшего'); return; }
            var blocks = document.querySelectorAll('.device-block'), devices = [], allValid = true;
            blocks.forEach(function(b) {
                var n = b.id.replace('device', '');
                var type = document.getElementById('typeField'+n)?.value.trim() || '', name = document.getElementById('nameField'+n)?.value.trim() || '', serial = document.getElementById('serialField'+n)?.value.trim() || '', note = document.getElementById('noteField'+n)?.value.trim() || '';
                if (!name || !type || !serial) { allValid = false; return; }
                devices.push({ type, name, serial, note });
            });
            if (!allValid || devices.length === 0) { alert('Заполните все поля'); return; }
            var btn = document.getElementById('submitBtn'); btn.disabled = true; btn.textContent = 'Отправка...';
            setStatus('Формирование и отправка...', 'loading');
            var now = new Date(), ds = ('0'+now.getDate()).slice(-2)+'.'+('0'+(now.getMonth()+1)).slice(-2)+'.'+now.getFullYear();
            var form = document.createElement('form'); form.method = 'POST'; form.action = SCRIPT_URL; form.target = 'hiddenFrame'; form.style.display = 'none';
            [{n:'date',v:ds},{n:'company',v:company},{n:'employee',v:employee},{n:'devices',v:JSON.stringify(devices)},{n:'email',v:settings.email}].forEach(function(f) {
                var i = document.createElement('input'); i.type = 'hidden'; i.name = f.n; i.value = f.v; form.appendChild(i);
            });
            document.body.appendChild(form); form.submit(); document.body.removeChild(form);
            setTimeout(function() { setStatus('✅ Акт отправлен на ' + settings.email, 'success'); btn.textContent = '✓ Отправлено'; btn.style.background = '#4CAF50'; }, 2000);
        }

        function setStatus(msg, cls) { var el = document.getElementById('status'); el.textContent = msg; el.className = 'status'; if (cls) el.classList.add(cls); }
        function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
    </script>
</body>
</html>
