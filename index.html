<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Приёмка СИ</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; padding: 15px; max-width: 500px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { font-size: 20px; color: #333; }
        .header p { font-size: 12px; color: #888; margin-top: 5px; }
        .field-group { margin-bottom: 15px; }
        .field-group label { display: block; font-size: 13px; font-weight: bold; color: #555; margin-bottom: 5px; }
        .field-row { display: flex; gap: 8px; }
        .field-row input, .field-row select { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; background: #fff; }
        .field-row select { appearance: auto; }
        .btn-camera { background: #4CAF50; color: #fff; border: none; border-radius: 8px; padding: 12px 16px; font-size: 18px; cursor: pointer; min-width: 50px; flex: 0 0 auto; }
        .btn-camera:active { background: #388E3C; }
        .btn-add { background: #2196F3; color: #fff; border: none; border-radius: 8px; padding: 12px 16px; font-size: 18px; cursor: pointer; min-width: 50px; flex: 0 0 auto; }
        .btn-submit { width: 100%; background: #FF5722; color: #fff; border: none; border-radius: 8px; padding: 16px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-submit:active { background: #E64A19; }
        .btn-submit:disabled { background: #ccc; }
        .preview { width: 100%; max-height: 200px; object-fit: contain; margin-top: 5px; border-radius: 8px; display: none; }
        .status { text-align: center; margin-top: 15px; font-size: 13px; color: #666; min-height: 20px; }
        .status.success { color: #4CAF50; }
        .status.error { color: #f44336; }
        .hint { font-size: 11px; color: #999; margin-top: 3px; }
        input[type="file"] { display: none; }
    </style>
</head>
<body>
    <div class="header">
        <h1>📋 Приёмка средств измерений</h1>
        <p>ООО МС «ЦЕНТР ИЗМЕРЕНИЙ»</p>
    </div>

    <!-- Компания-сдатчик -->
    <div class="field-group">
        <label>Компания-сдатчик:</label>
        <div class="field-row">
            <select id="companySelect"><option value="">-- Загрузка... --</option></select>
            <button class="btn-add" onclick="addCompany()" title="Добавить компанию">➕</button>
        </div>
    </div>

    <!-- Название прибора -->
    <div class="field-group">
        <label>📷 Название прибора:</label>
        <div class="field-row">
            <input type="text" id="nameField" placeholder="Отсканируйте или введите">
            <button class="btn-camera" onclick="capturePhoto('name')" title="Сканировать название">📷</button>
        </div>
        <img id="previewName" class="preview" alt="Фото названия">
        <input type="file" id="fileName" accept="image/*" capture="environment" onchange="processPhoto('name')">
    </div>

    <!-- Тип прибора -->
    <div class="field-group">
        <label>Тип прибора:</label>
        <div class="field-row">
            <input type="text" id="typeField" placeholder="Определится автоматически или введите" list="typeList">
            <datalist id="typeList"></datalist>
        </div>
    </div>

    <!-- Заводской номер -->
    <div class="field-group">
        <label>📷 Заводской номер:</label>
        <div class="field-row">
            <input type="text" id="serialField" placeholder="Отсканируйте или введите">
            <button class="btn-camera" onclick="capturePhoto('serial')" title="Сканировать номер">📷</button>
        </div>
        <img id="previewSerial" class="preview" alt="Фото номера">
        <input type="file" id="fileSerial" accept="image/*" capture="environment" onchange="processPhoto('serial')">
    </div>

    <!-- Примечание -->
    <div class="field-group">
        <label>Примечание:</label>
        <input type="text" id="noteField" placeholder="Состояние, комплектность..." style="width:100%; padding:12px; border:1px solid #ddd; border-radius:8px; font-size:16px;">
    </div>

    <!-- Кто принял -->
    <div class="field-group">
        <label>Кто принял:</label>
        <select id="employeeSelect"><option value="">-- Загрузка... --</option></select>
    </div>

    <!-- Кнопка отправки -->
    <button class="btn-submit" id="submitBtn" onclick="submitAct()">📧 Сформировать акт и отправить</button>
    <div class="hint" style="text-align:center;">Письмо уйдёт на ms-tcentr@mail.ru</div>
    <div class="status" id="status"></div>

    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script>
        var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz4W9aoohEnsWK3cXhqTm2mMl4WfSbmVK-JbGXBBjbXyRYw44p8TEVZNu-DpoyVGHUW/exec';
        
        // CSV URL для листов
        var CSV_BASE = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQJLJVjVpDuLsNRjFg9j7X2NHcDtOgmo4lhiC_CTx2S0ox97Hne91SXQ7XtJJxb9OberlzYUrSXijw6/pub?output=csv&gid=';
        // GID листов (нужно определить)
        var GID_TYPES = '883764981';
        var GID_COMPANIES = '0';
        var GID_EMPLOYEES = '0';
        
        var typesData = [];
        var companiesData = [];
        var employeesData = [];
        var photoTypeBase64 = '';
        var photoSerialBase64 = '';

        window.addEventListener('load', function() {
            loadDictionaries();
        });

        function loadDictionaries() {
            setStatus('Загрузка справочников...');
            
            // Пытаемся загрузить через опубликованный CSV
            fetch(CSV_BASE + GID_TYPES)
                .then(r => r.text())
                .then(csv => {
                    typesData = parseCSV(csv);
                    updateTypeSuggestions();
                })
                .catch(e => console.log('Типы не загружены:', e));
            
            fetch(CSV_BASE + GID_COMPANIES)
                .then(r => r.text())
                .then(csv => {
                    companiesData = parseCSV(csv);
                    updateCompanyList();
                })
                .catch(e => console.log('Компании не загружены:', e));
            
            fetch(CSV_BASE + GID_EMPLOYEES)
                .then(r => r.text())
                .then(csv => {
                    employeesData = parseCSV(csv);
                    updateEmployeeList();
                    setStatus('Готов к работе');
                })
                .catch(e => {
                    console.log('Приёмщики не загружены:', e);
                    setStatus('Готов к работе (справочники не загружены)');
                });
        }

        function parseCSV(csv) {
            var lines = csv.trim().split('\n');
            var result = [];
            for (var i = 0; i < lines.length; i++) {
                var cells = [];
                var current = '';
                var inQuotes = false;
                for (var j = 0; j < lines[i].length; j++) {
                    var ch = lines[i][j];
                    if (ch === '"') {
                        inQuotes = !inQuotes;
                    } else if (ch === ',' && !inQuotes) {
                        cells.push(current.trim());
                        current = '';
                    } else {
                        current += ch;
                    }
                }
                cells.push(current.trim());
                result.push(cells);
            }
            return result;
        }

        function updateCompanyList() {
            var sel = document.getElementById('companySelect');
            sel.innerHTML = '<option value="">-- Выберите компанию --</option>';
            var names = [];
            companiesData.forEach(function(row) {
                if (row[0] && names.indexOf(row[0]) === -1 && row[0].length > 1) {
                    names.push(row[0]);
                    sel.innerHTML += '<option value="' + escapeHtml(row[0]) + '">' + escapeHtml(row[0]) + '</option>';
                }
            });
            if (names.length === 0) {
                sel.innerHTML = '<option value="">-- Нет данных. Добавьте вручную --</option>';
            }
        }

        function updateEmployeeList() {
            var sel = document.getElementById('employeeSelect');
            sel.innerHTML = '<option value="">-- Выберите --</option>';
            employeesData.forEach(function(row) {
                if (row[0] && row[0].length > 1) {
                    sel.innerHTML += '<option value="' + escapeHtml(row[0]) + '">' + escapeHtml(row[0]) + '</option>';
                }
            });
            if (employeesData.length === 0 || (employeesData.length === 1 && !employeesData[0][0])) {
                sel.innerHTML = '<option value="">-- Нет данных --</option>';
            }
        }

        function updateTypeSuggestions() {
            var list = document.getElementById('typeList');
            var types = [];
            typesData.forEach(function(row) {
                if (row[1] && types.indexOf(row[1]) === -1 && row[1].length > 1) {
                    types.push(row[1]);
                }
            });
            list.innerHTML = '';
            types.forEach(function(t) {
                list.innerHTML += '<option value="' + escapeHtml(t) + '">';
            });
        }

        function findTypeByName(name) {
            if (!name) return '';
            var nameLower = name.toLowerCase().replace(/[^a-zа-я0-9]/g, '');
            var bestMatch = '';
            var bestScore = 0;
            
            typesData.forEach(function(row) {
                var refName = (row[0] || '').toLowerCase().replace(/[^a-zа-я0-9]/g, '');
                if (refName && nameLower.includes(refName)) {
                    var score = refName.length;
                    if (score > bestScore) {
                        bestScore = score;
                        bestMatch = row[1] || '';
                    }
                }
            });
            
            return bestMatch;
        }

        function capturePhoto(target) {
            var input = document.getElementById('file' + (target === 'name' ? 'Name' : 'Serial'));
            input.click();
        }

        function processPhoto(target) {
            var input = document.getElementById('file' + (target === 'name' ? 'Name' : 'Serial'));
            if (!input.files || !input.files[0]) return;
            
            var file = input.files[0];
            var reader = new FileReader();
            
            reader.onload = function(e) {
                var fullDataUrl = e.target.result;
                var base64 = fullDataUrl.split(',')[1];
                var preview = document.getElementById('preview' + (target === 'name' ? 'Name' : 'Serial'));
                
                // Сжимаем изображение для превью и распознавания
                compressImage(fullDataUrl, 800, 0.7, function(compressedDataUrl) {
                    preview.src = compressedDataUrl;
                    preview.style.display = 'block';
                    
                    // Сохраняем сжатое фото для отправки
                    var compressedBase64 = compressedDataUrl.split(',')[1];
                    if (target === 'name') {
                        photoTypeBase64 = compressedBase64;
                    } else {
                        photoSerialBase64 = compressedBase64;
                    }
                    
                    // Распознаём
                    recognizeText(compressedDataUrl, target);
                });
            };
            reader.readAsDataURL(file);
        }

        function compressImage(dataUrl, maxWidth, quality, callback) {
            var img = new Image();
            img.onload = function() {
                var canvas = document.createElement('canvas');
                var width = img.width;
                var height = img.height;
                
                if (width > maxWidth) {
                    height = height * (maxWidth / width);
                    width = maxWidth;
                }
                
                canvas.width = width;
                canvas.height = height;
                var ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                callback(canvas.toDataURL('image/jpeg', quality));
            };
            img.src = dataUrl;
        }

        function recognizeText(imageDataUrl, target) {
            setStatus('Распознавание...');
            
            Tesseract.recognize(imageDataUrl, 'rus+eng', {
                logger: function(m) {
                    if (m.status === 'recognizing text') {
                        setStatus('Распознавание: ' + Math.round(m.progress * 100) + '%');
                    }
                }
            }).then(function(result) {
                var rawText = result.data.text;
                console.log('Распознано сырое (' + target + '):', rawText);
                
                var text = cleanRecognizedText(rawText);
                console.log('Распознано чистое (' + target + '):', text);
                
                if (target === 'name') {
                    document.getElementById('nameField').value = text;
                    var foundType = findTypeByName(text);
                    if (foundType) {
                        document.getElementById('typeField').value = foundType;
                        setStatus('✅ Название и тип определены');
                    } else {
                        setStatus('✅ Название заполнено. Укажите тип вручную.');
                    }
                } else if (target === 'serial') {
                    var serial = extractSerialNumber(text);
                    document.getElementById('serialField').value = serial;
                    setStatus(serial ? '✅ Номер распознан: ' + serial : '⚠️ Проверьте номер. Распознано: ' + text.substring(0, 30));
                }
            }).catch(function(error) {
                console.error('Ошибка распознавания:', error);
                setStatus('❌ Ошибка распознавания. Попробуйте ещё раз.');
            });
        }

        function cleanRecognizedText(text) {
            // Удаляем одиночные буквы, мусорные символы, лишние пробелы
            var cleaned = text
                .replace(/[^\w\s\-\.\/№а-яА-ЯёЁa-zA-Z0-9]/g, ' ')  // только буквы, цифры, пробел, дефис, точка, слэш, №
                .replace(/\s+/g, ' ')
                .trim();
            
            // Удаляем строки короче 2 символов (мусор)
            var parts = cleaned.split(' ').filter(function(p) { return p.length >= 2; });
            return parts.join(' ');
        }

        function extractSerialNumber(text) {
            // Паттерны заводского номера
            var patterns = [
                /(?:№|SN|зав\.?\s*№?|заводской\s*№?|сер\.?\s*№?)\s*[:=\-\s]*\s*([A-Za-zА-Яа-я0-9\-\.\/]{3,})/i,
                /(?:номер|number)\s*[:=\-\s]*\s*([A-Za-zА-Яа-я0-9\-\.\/]{3,})/i,
                /\b(\d{5,})\b/,
                /\b([A-Z]{1,3}\s*\d{4,})\b/
            ];
            
            for (var i = 0; i < patterns.length; i++) {
                var match = text.match(patterns[i]);
                if (match && match[1]) {
                    return match[1].trim();
                }
            }
            
            // Если ничего не подошло — возвращаем весь текст (вдруг номер — это и есть всё)
            return text;
        }

        function addCompany() {
            var name = prompt('Введите название новой компании:');
            if (name && name.trim()) {
                var sel = document.getElementById('companySelect');
                var trimmed = name.trim();
                sel.innerHTML += '<option value="' + escapeHtml(trimmed) + '" selected>' + escapeHtml(trimmed) + '</option>';
                companiesData.push([trimmed]);
                setStatus('Компания "' + trimmed + '" добавлена');
            }
        }

        function submitAct() {
            var company = document.getElementById('companySelect').value;
            var type = document.getElementById('typeField').value.trim();
            var name = document.getElementById('nameField').value.trim();
            var serial = document.getElementById('serialField').value.trim();
            var note = document.getElementById('noteField').value.trim();
            var employee = document.getElementById('employeeSelect').value;
            
            if (!company) { alert('Выберите компанию-сдатчика'); return; }
            if (!name) { alert('Введите или отсканируйте название прибора'); return; }
            if (!type) { alert('Введите или выберите тип прибора'); return; }
            if (!serial) { alert('Введите или отсканируйте заводской номер'); return; }
            if (!employee) { alert('Выберите принявшего'); return; }
            
            var btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.textContent = 'Отправка...';
            setStatus('Формирование акта и отправка...');
            
            var now = new Date();
            var dateStr = ('0' + now.getDate()).slice(-2) + '.' + 
                          ('0' + (now.getMonth() + 1)).slice(-2) + '.' + 
                          now.getFullYear();
            
            var payload = {
                date: dateStr,
                company: company,
                type: type,
                name: name,
                serial: serial,
                note: note,
                employee: employee,
                photoType: photoTypeBase64,
                photoSerial: photoSerialBase64
            };
            
            fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify(payload),
                headers: { 'Content-Type': 'application/json' }
            })
            .then(function(r) { return r.text(); })
            .then(function(response) {
                if (response === 'OK') {
                    setStatus('✅ Акт отправлен на ms-tcentr@mail.ru');
                    btn.textContent = '✓ Отправлено';
                    btn.style.background = '#4CAF50';
                    photoTypeBase64 = '';
                    photoSerialBase64 = '';
                    document.getElementById('previewName').style.display = 'none';
                    document.getElementById('previewSerial').style.display = 'none';
                } else {
                    throw new Error(response);
                }
            })
            .catch(function(error) {
                console.error('Ошибка отправки:', error);
                setStatus('❌ Ошибка отправки: ' + error.message);
                btn.disabled = false;
                btn.textContent = '📧 Сформировать акт и отправить';
            });
        }

        function setStatus(msg) {
            var el = document.getElementById('status');
            el.textContent = msg;
            el.className = 'status';
            if (msg.indexOf('✅') > -1) el.className = 'status success';
            if (msg.indexOf('❌') > -1 || msg.indexOf('⚠️') > -1) el.className = 'status error';
        }

        function escapeHtml(str) {
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }
    </script>
</body>
</html>
