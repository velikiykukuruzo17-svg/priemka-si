<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Приёмка СИ</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; padding: 15px; max-width: 500px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { font-size: 20px; color: #333; }
        .header p { font-size: 12px; color: #888; margin-top: 5px; }
        .field-group { margin-bottom: 15px; }
        .field-group label { display: block; font-size: 13px; font-weight: bold; color: #555; margin-bottom: 5px; }
        .field-row { display: flex; gap: 8px; }
        .field-row input, .field-row select { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; background: #fff; }
        .field-row select { appearance: auto; }
        .btn-camera { background: #4CAF50; color: #fff; border: none; border-radius: 8px; padding: 12px 16px; font-size: 18px; cursor: pointer; min-width: 50px; }
        .btn-camera:active { background: #388E3C; }
        .btn-add { background: #2196F3; color: #fff; border: none; border-radius: 8px; padding: 12px 16px; font-size: 18px; cursor: pointer; min-width: 50px; }
        .btn-submit { width: 100%; background: #FF5722; color: #fff; border: none; border-radius: 8px; padding: 16px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-submit:active { background: #E64A19; }
        .btn-submit:disabled { background: #ccc; }
        .preview { width: 100%; max-height: 200px; object-fit: contain; margin-top: 5px; border-radius: 8px; display: none; }
        .status { text-align: center; margin-top: 15px; font-size: 13px; color: #666; min-height: 20px; }
        .status.success { color: #4CAF50; }
        .status.error { color: #f44336; }
        .hint { font-size: 11px; color: #999; margin-top: 3px; }
        input[type="file"] { display: none; }
    </style>
</head>
<body>
    <div class="header">
        <h1>📋 Приёмка средств измерений</h1>
        <p>ООО МС «ЦЕНТР ИЗМЕРЕНИЙ»</p>
    </div>

    <!-- Компания-сдатчик -->
    <div class="field-group">
        <label>Компания-сдатчик:</label>
        <div class="field-row">
            <select id="companySelect"></select>
            <button class="btn-add" onclick="addCompany()" title="Добавить компанию">➕</button>
        </div>
    </div>

    <!-- Название прибора -->
    <div class="field-group">
        <label>📷 Название прибора:</label>
        <div class="field-row">
            <input type="text" id="nameField" placeholder="Отсканируйте или введите">
            <button class="btn-camera" onclick="capturePhoto('name')" title="Сканировать название">📷</button>
        </div>
        <img id="previewName" class="preview" alt="Фото названия">
        <input type="file" id="fileName" accept="image/*" capture="environment" onchange="processPhoto('name')">
    </div>

    <!-- Тип прибора -->
    <div class="field-group">
        <label>Тип прибора:</label>
        <div class="field-row">
            <input type="text" id="typeField" placeholder="Определится автоматически или введите" list="typeList">
            <datalist id="typeList"></datalist>
        </div>
    </div>

    <!-- Заводской номер -->
    <div class="field-group">
        <label>📷 Заводской номер:</label>
        <div class="field-row">
            <input type="text" id="serialField" placeholder="Отсканируйте или введите">
            <button class="btn-camera" onclick="capturePhoto('serial')" title="Сканировать номер">📷</button>
        </div>
        <img id="previewSerial" class="preview" alt="Фото номера">
        <input type="file" id="fileSerial" accept="image/*" capture="environment" onchange="processPhoto('serial')">
    </div>

    <!-- Примечание -->
    <div class="field-group">
        <label>Примечание:</label>
        <input type="text" id="noteField" placeholder="Состояние, комплектность..." style="width:100%;">
    </div>

    <!-- Кто принял -->
    <div class="field-group">
        <label>Кто принял:</label>
        <select id="employeeSelect"></select>
    </div>

    <!-- Кнопка отправки -->
    <button class="btn-submit" id="submitBtn" onclick="submitAct()">📧 Сформировать акт и отправить</button>
    <div class="hint" style="text-align:center;">Письмо уйдёт на ms-tcentr@mail.ru</div>
    <div class="status" id="status"></div>

    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script>
        // URL скрипта Google Apps
        var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz4W9aoohEnsWK3cXhqTm2mMl4WfSbmVK-JbGXBBjbXyRYw44p8TEVZNu-DpoyVGHUW/exec';
        var SPREADSHEET_ID = '1nj6cd6fGp6WVNDcHpRPxT4OLL6iUYli5IO8l6TVzMLI';
        
        // Хранилище справочников
        var typesData = [];
        var companiesData = [];
        var employeesData = [];
        
        // Фото в base64
        var photoTypeBase64 = '';
        var photoSerialBase64 = '';

        // Инициализация
        window.addEventListener('load', function() {
            loadDictionaries();
        });

        // Загрузка справочников из Google Таблицы
        function loadDictionaries() {
            setStatus('Загрузка справочников...');
            
            // Загружаем через Google Sheets API (публичный доступ)
            var sheets = ['Типы', 'Компании', 'Приёмщики'];
            var ranges = [
                'Типы!B2:C',      // Название, Тип
                'Компании!A2:A',  // Название компании
                'Приёмщики!B2:B'  // ФИО
            ];
            
            var url = 'https://docs.google.com/spreadsheets/d/' + SPREADSHEET_ID + '/gviz/tq?tqx=out:csv&sheet=';
            
            // Загружаем типы
            fetch(url + 'Типы' + '&range=B2:C')
                .then(r => r.text())
                .then(csv => {
                    typesData = parseCSV(csv);
                    updateTypeSuggestions();
                })
                .catch(e => console.log('Типы не загружены:', e));
            
            // Загружаем компании
            fetch(url + 'Компании' + '&range=A2:A')
                .then(r => r.text())
                .then(csv => {
                    companiesData = parseCSV(csv);
                    updateCompanyList();
                })
                .catch(e => console.log('Компании не загружены:', e));
            
            // Загружаем приёмщиков
            fetch(url + 'Приёмщики' + '&range=B2:B')
                .then(r => r.text())
                .then(csv => {
                    employeesData = parseCSV(csv);
                    updateEmployeeList();
                    setStatus('Готов к работе');
                })
                .catch(e => {
                    console.log('Приёмщики не загружены:', e);
                    setStatus('Готов к работе');
                });
        }

        function parseCSV(csv) {
            var lines = csv.trim().split('\n');
            var result = [];
            for (var i = 0; i < lines.length; i++) {
                var cells = lines[i].split(',');
                // Убираем кавычки
                cells = cells.map(function(c) { return c.replace(/^"|"$/g, '').trim(); });
                result.push(cells);
            }
            return result;
        }

        function updateCompanyList() {
            var sel = document.getElementById('companySelect');
            sel.innerHTML = '<option value="">-- Выберите компанию --</option>';
            var names = [];
            companiesData.forEach(function(row) {
                if (row[0] && names.indexOf(row[0]) === -1) {
                    names.push(row[0]);
                    sel.innerHTML += '<option value="' + escapeHtml(row[0]) + '">' + escapeHtml(row[0]) + '</option>';
                }
            });
        }

        function updateEmployeeList() {
            var sel = document.getElementById('employeeSelect');
            sel.innerHTML = '<option value="">-- Выберите --</option>';
            employeesData.forEach(function(row) {
                if (row[0]) {
                    sel.innerHTML += '<option value="' + escapeHtml(row[0]) + '">' + escapeHtml(row[0]) + '</option>';
                }
            });
        }

        function updateTypeSuggestions() {
            var list = document.getElementById('typeList');
            var types = [];
            typesData.forEach(function(row) {
                if (row[1] && types.indexOf(row[1]) === -1) {
                    types.push(row[1]);
                }
            });
            list.innerHTML = '';
            types.forEach(function(t) {
                list.innerHTML += '<option value="' + escapeHtml(t) + '">';
            });
        }

        // Поиск типа по названию
        function findTypeByName(name) {
            if (!name) return '';
            var nameLower = name.toLowerCase().trim();
            for (var i = 0; i < typesData.length; i++) {
                var refName = (typesData[i][0] || '').toLowerCase().trim();
                if (refName && nameLower.includes(refName) || refName.includes(nameLower)) {
                    return typesData[i][1] || '';
                }
            }
            return '';
        }

        // Захват фото
        function capturePhoto(target) {
            var input = document.getElementById('file' + (target === 'name' ? 'Name' : 'Serial'));
            input.click();
        }

        // Обработка фото
        function processPhoto(target) {
            var input = document.getElementById('file' + (target === 'name' ? 'Name' : 'Serial'));
            if (!input.files || !input.files[0]) return;
            
            var file = input.files[0];
            var reader = new FileReader();
            
            // Показываем превью
            reader.onload = function(e) {
                var preview = document.getElementById('preview' + (target === 'name' ? 'Name' : 'Serial'));
                preview.src = e.target.result;
                preview.style.display = 'block';
                
                // Сохраняем base64
                if (target === 'name') {
                    photoTypeBase64 = e.target.result.split(',')[1];
                } else {
                    photoSerialBase64 = e.target.result.split(',')[1];
                }
                
                // Запускаем распознавание
                recognizeText(e.target.result, target);
            };
            reader.readAsDataURL(file);
        }

        // Распознавание текста
        function recognizeText(imageDataUrl, target) {
            setStatus('Распознавание...');
            
            Tesseract.recognize(imageDataUrl, 'rus+eng', {
                logger: function(m) {
                    if (m.status === 'recognizing text') {
                        setStatus('Распознавание: ' + Math.round(m.progress * 100) + '%');
                    }
                }
            }).then(function(result) {
                var text = result.data.text.trim();
                console.log('Распознано (' + target + '):', text);
                
                if (target === 'name') {
                    // Заполняем название
                    var cleanText = cleanRecognizedText(text);
                    document.getElementById('nameField').value = cleanText;
                    
                    // Ищем тип по названию
                    var foundType = findTypeByName(cleanText);
                    if (foundType) {
                        document.getElementById('typeField').value = foundType;
                        setStatus('✅ Название и тип определены');
                    } else {
                        setStatus('✅ Название заполнено. Укажите тип вручную.');
                    }
                } else if (target === 'serial') {
                    // Ищем заводской номер
                    var serial = extractSerialNumber(text);
                    document.getElementById('serialField').value = serial || text;
                    setStatus(serial ? '✅ Номер распознан' : '⚠️ Проверьте номер');
                }
            }).catch(function(error) {
                console.error('Ошибка распознавания:', error);
                setStatus('❌ Ошибка распознавания. Попробуйте ещё раз или введите вручную.');
            });
        }

        function cleanRecognizedText(text) {
            // Убираем лишние пробелы и переносы
            return text.replace(/\n/g, ' ').replace(/\s+/g, ' ').trim();
        }

        function extractSerialNumber(text) {
            // Ищем паттерны заводских номеров
            var patterns = [
                /(?:№|SN|зав\.?\s*№?|заводской\s*№?)\s*[:=\s]*([A-Za-zА-Яа-я0-9\-\.\/]+)/i,
                /\b(\d{4,})\b/,
                /([A-Z]{2}\d{4,})/i
            ];
            
            for (var i = 0; i < patterns.length; i++) {
                var match = text.match(patterns[i]);
                if (match && match[1]) {
                    return match[1];
                }
            }
            
            return text;
        }

        // Добавление компании
        function addCompany() {
            var name = prompt('Введите название новой компании:');
            if (name && name.trim()) {
                var sel = document.getElementById('companySelect');
                sel.innerHTML += '<option value="' + escapeHtml(name.trim()) + '" selected>' + escapeHtml(name.trim()) + '</option>';
                // Добавляем в массив для будущих отправок
                companiesData.push([name.trim()]);
                setStatus('Компания добавлена локально');
            }
        }

        // Отправка акта
        function submitAct() {
            var company = document.getElementById('companySelect').value;
            var type = document.getElementById('typeField').value.trim();
            var name = document.getElementById('nameField').value.trim();
            var serial = document.getElementById('serialField').value.trim();
            var note = document.getElementById('noteField').value.trim();
            var employee = document.getElementById('employeeSelect').value;
            
            // Проверка
            if (!company) { alert('Выберите компанию-сдатчика'); return; }
            if (!name) { alert('Введите или отсканируйте название прибора'); return; }
            if (!type) { alert('Введите или выберите тип прибора'); return; }
            if (!serial) { alert('Введите или отсканируйте заводской номер'); return; }
            if (!employee) { alert('Выберите принявшего'); return; }
            
            var btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.textContent = 'Отправка...';
            setStatus('Формирование акта и отправка...');
            
            // Формируем дату
            var now = new Date();
            var dateStr = ('0' + now.getDate()).slice(-2) + '.' + 
                          ('0' + (now.getMonth() + 1)).slice(-2) + '.' + 
                          now.getFullYear();
            
            var payload = {
                date: dateStr,
                company: company,
                type: type,
                name: name,
                serial: serial,
                note: note,
                employee: employee,
                photoType: photoTypeBase64,
                photoSerial: photoSerialBase64
            };
            
            fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify(payload),
                headers: { 'Content-Type': 'application/json' }
            })
            .then(function(r) { return r.text(); })
            .then(function(response) {
                if (response === 'OK') {
                    setStatus('✅ Акт отправлен на ms-tcentr@mail.ru');
                    btn.textContent = '✓ Отправлено';
                    btn.style.background = '#4CAF50';
                    
                    // Сбрасываем фото
                    photoTypeBase64 = '';
                    photoSerialBase64 = '';
                    document.getElementById('previewName').style.display = 'none';
                    document.getElementById('previewSerial').style.display = 'none';
                } else {
                    throw new Error(response);
                }
            })
            .catch(function(error) {
                console.error('Ошибка отправки:', error);
                setStatus('❌ Ошибка отправки: ' + error.message);
                btn.disabled = false;
                btn.textContent = '📧 Сформировать акт и отправить';
            });
        }

        function setStatus(msg) {
            var el = document.getElementById('status');
            el.textContent = msg;
            el.className = 'status';
            if (msg.indexOf('✅') > -1) el.className = 'status success';
            if (msg.indexOf('❌') > -1 || msg.indexOf('⚠️') > -1) el.className = 'status error';
        }

        function escapeHtml(str) {
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }
    </script>
</body>
</html>
