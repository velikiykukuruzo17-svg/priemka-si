<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Приёмка СИ</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; padding: 15px; max-width: 500px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { font-size: 20px; color: #333; }
        .header p { font-size: 12px; color: #888; margin-top: 5px; }
        .field-group { margin-bottom: 12px; }
        .field-group label { display: block; font-size: 13px; font-weight: bold; color: #555; margin-bottom: 4px; }
        .field-row { display: flex; gap: 6px; }
        .field-row input, .field-row select { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; background: #fff; }
        .btn-camera { background: #4CAF50; color: #fff; border: none; border-radius: 8px; padding: 10px 14px; font-size: 18px; cursor: pointer; min-width: 46px; flex: 0 0 auto; }
        .btn-camera:active { background: #388E3C; }
        .btn-remove { background: #f44336; color: #fff; border: none; border-radius: 8px; padding: 10px 14px; font-size: 16px; cursor: pointer; min-width: 46px; flex: 0 0 auto; }
        .btn-add-device { width: 100%; background: #2196F3; color: #fff; border: none; border-radius: 8px; padding: 14px; font-size: 16px; cursor: pointer; margin: 10px 0; }
        .btn-submit { width: 100%; background: #FF5722; color: #fff; border: none; border-radius: 8px; padding: 16px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-submit:active { background: #E64A19; }
        .btn-submit:disabled { background: #ccc; }
        .device-block { background: #fff; border: 1px solid #e0e0e0; border-radius: 12px; padding: 12px; margin-bottom: 12px; position: relative; }
        .device-block .device-title { font-size: 14px; font-weight: bold; color: #333; margin-bottom: 8px; }
        .device-block .device-number { background: #eee; border-radius: 50%; width: 24px; height: 24px; display: inline-block; text-align: center; line-height: 24px; font-size: 13px; margin-right: 6px; }
        .preview { width: 100%; max-height: 150px; object-fit: contain; margin-top: 4px; border-radius: 8px; display: none; }
        .status { text-align: center; margin-top: 15px; font-size: 13px; color: #666; min-height: 20px; }
        .status.success { color: #4CAF50; }
        .status.error { color: #f44336; }
        .status.loading { color: #FF9800; }
        .hint { font-size: 11px; color: #999; margin-top: 3px; text-align: center; }
        .section-title { font-size: 14px; color: #888; margin: 15px 0 8px; border-top: 1px solid #ddd; padding-top: 12px; }
        
        #viewfinder { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 9999; }
        #viewfinder video { width: 100%; height: 100%; object-fit: cover; }
        #viewfinder .frame { position: absolute; border: 3px solid #4CAF50; border-radius: 12px; box-shadow: 0 0 0 9999px rgba(0,0,0,0.5); }
        #viewfinder .btn-capture { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); width: 70px; height: 70px; border-radius: 50%; background: #fff; border: 4px solid #4CAF50; cursor: pointer; z-index: 10001; }
        #viewfinder .btn-capture:active { background: #4CAF50; }
        #viewfinder .btn-close-view { position: absolute; top: 20px; right: 20px; width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,0.3); border: none; color: #fff; font-size: 24px; cursor: pointer; z-index: 10001; }
        #viewfinder .controls { position: absolute; bottom: 130px; left: 50%; transform: translateX(-50%); display: flex; gap: 4px; z-index: 10001; }
        #viewfinder .controls button { width: 38px; height: 38px; border-radius: 8px; border: 2px solid #fff; background: rgba(0,0,0,0.5); color: #fff; font-size: 16px; cursor: pointer; }
        #viewfinder .controls button:active { background: rgba(255,255,255,0.3); }
        
        input[type="file"] { display: none; }
    </style>
</head>
<body>
    <div class="header">
        <h1>📋 Приёмка средств измерений</h1>
        <p>ООО МС «ЦЕНТР ИЗМЕРЕНИЙ»</p>
    </div>

    <div class="field-group">
        <label>Компания-сдатчик:</label>
        <div class="field-row">
            <select id="companySelect"><option value="">-- Загрузка... --</option></select>
            <button class="btn-camera" onclick="addCompany()" title="Добавить" style="font-size:20px;">➕</button>
        </div>
    </div>

    <div class="field-group">
        <label>Кто принял:</label>
        <select id="employeeSelect"><option value="">-- Загрузка... --</option></select>
    </div>

    <div class="section-title">Приборы:</div>
    <div id="devicesContainer"></div>

    <button class="btn-add-device" onclick="addDevice()">➕ Добавить прибор</button>

    <button class="btn-submit" id="submitBtn" onclick="submitAct()">📧 Сформировать акт и отправить</button>
    <div class="hint">Письмо уйдёт на ms-tcentr@mail.ru</div>
    <div class="status" id="status"></div>

    <div id="viewfinder">
        <video id="vfVideo" autoplay playsinline></video>
        <div class="frame" id="vfFrame"></div>
        <button class="btn-close-view" onclick="closeViewfinder()">✕</button>
        <div class="controls">
            <button onclick="resizeFrame(-2,0)">−</button>
            <button onclick="moveFrame(0,-3)">▲</button>
            <button onclick="resizeFrame(0,-2)">−</button>
            <button onclick="moveFrame(-3,0)">◄</button>
            <button onclick="resizeFrame(2,0)">+</button>
            <button onclick="moveFrame(3,0)">►</button>
            <button onclick="moveFrame(0,3)">▼</button>
            <button onclick="resizeFrame(0,2)">+</button>
        </div>
        <button class="btn-capture" onclick="captureFromViewfinder()"></button>
    </div>

    <iframe name="hiddenFrame" style="display:none;"></iframe>

    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script>
        var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw3PHbAcHAaLmC3cab1HOc7qEiz2erKGfwwQ5GeN2qZbfeid1UbZ3IeYRNA_McNLPuN/exec';
        var CSV_BASE = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQJLJVjVpDuLsNRjFg9j7X2NHcDtOgmo4lhiC_CTx2S0ox97Hne91SXQ7XtJJxb9OberlzYUrSXijw6/pub?output=csv&gid=';
        var GID_TYPES = '441822937';
        var GID_COMPANIES = '883764981';
        var GID_EMPLOYEES = '1294860374';

        var typesData = [];
        var deviceCounter = 0;
        var vfStream = null, vfTarget = null, vfDeviceNum = null;
        var vfFrameW = 70, vfFrameH = 40, vfFrameX = 50, vfFrameY = 45;

        window.addEventListener('load', function() {
            setStatus('Загрузка справочников...', 'loading');
            loadDictionaries();
            addDevice();
        });

        function loadDictionaries() {
            Promise.all([
                fetch(CSV_BASE + GID_TYPES).then(r => r.text()),
                fetch(CSV_BASE + GID_COMPANIES).then(r => r.text()),
                fetch(CSV_BASE + GID_EMPLOYEES).then(r => r.text())
            ]).then(function(results) {
                typesData = parseCSV(results[0]);
                updateSelect('companySelect', parseCSV(results[1]), 0);
                updateSelect('employeeSelect', parseCSV(results[2]), 1);
                setStatus('✅ Готов к работе', 'success');
            }).catch(function(e) { setStatus('⚠️ Ошибка загрузки справочников', 'error'); });
        }

        function parseCSV(csv) {
            var lines = csv.trim().split('\n');
            var result = [];
            for (var i = 1; i < lines.length; i++) {
                var cells = [], current = '', inQuotes = false;
                for (var j = 0; j < lines[i].length; j++) {
                    var ch = lines[i][j];
                    if (ch === '"') inQuotes = !inQuotes;
                    else if (ch === ',' && !inQuotes) { cells.push(current.trim()); current = ''; }
                    else current += ch;
                }
                cells.push(current.trim());
                if (cells.some(function(c) { return c.length > 0; })) result.push(cells);
            }
            return result;
        }

        function updateSelect(id, data, col) {
            var sel = document.getElementById(id);
            sel.innerHTML = '<option value="">-- Выберите --</option>';
            var names = [];
            data.forEach(function(row) {
                var val = row[col] || row[0] || '';
                if (val && names.indexOf(val) === -1) { names.push(val); sel.innerHTML += '<option value="' + esc(val) + '">' + esc(val) + '</option>'; }
            });
        }

        function addDevice() {
            deviceCounter++;
            var block = document.createElement('div'); block.className = 'device-block'; block.id = 'device' + deviceCounter;
            block.innerHTML = `<div class="device-title"><span class="device-number">${deviceCounter}</span> Прибор</div>
                <div class="field-group"><label>📷 Название:</label><div class="field-row"><input type="text" id="nameField${deviceCounter}" placeholder="Отсканируйте или введите"><button class="btn-camera" onclick="openViewfinder('name',${deviceCounter})">📷</button></div><img id="previewName${deviceCounter}" class="preview" alt="Фото названия"></div>
                <div class="field-group"><label>Тип:</label><div class="field-row"><input type="text" id="typeField${deviceCounter}" placeholder="Авто или вручную" list="typeList"><datalist id="typeList"></datalist></div></div>
                <div class="field-group"><label>📷 Заводской номер:</label><div class="field-row"><input type="text" id="serialField${deviceCounter}" placeholder="Отсканируйте или введите"><button class="btn-camera" onclick="openViewfinder('serial',${deviceCounter})">📷</button></div><img id="previewSerial${deviceCounter}" class="preview" alt="Фото номера"></div>
                <div class="field-group"><label>Примечание:</label><input type="text" id="noteField${deviceCounter}" placeholder="Состояние, комплектность..." style="width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;font-size:15px;"></div>`;
            if (deviceCounter > 1) {
                var rb = document.createElement('button'); rb.className = 'btn-remove'; rb.textContent = '🗑️'; rb.style.cssText = 'position:absolute;top:8px;right:8px;';
                rb.onclick = function() { block.remove(); renumberDevices(); }; block.appendChild(rb);
            }
            document.getElementById('devicesContainer').appendChild(block);
            renumberDevices();
        }

        function removeDevice(id) { var b = document.getElementById(id); if (b) b.remove(); renumberDevices(); }
        function renumberDevices() {
            var blocks = document.querySelectorAll('.device-block'); deviceCounter = blocks.length;
            blocks.forEach(function(b, i) { b.id = 'device' + (i+1); var s = b.querySelector('.device-number'); if (s) s.textContent = i+1; });
        }

        function openViewfinder(target, deviceNum) {
            vfTarget = target; vfDeviceNum = deviceNum;
            updateFramePosition();
            document.getElementById('viewfinder').style.display = 'block';
            var video = document.getElementById('vfVideo');
            navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } }).then(function(stream) {
                vfStream = stream; video.srcObject = stream; video.play();
            }).catch(function() { closeViewfinder(); });
        }

        function updateFramePosition() {
            var f = document.getElementById('vfFrame');
            f.style.width = vfFrameW + '%'; f.style.height = vfFrameH + '%';
            f.style.left = (vfFrameX - vfFrameW/2) + '%'; f.style.top = (vfFrameY - vfFrameH/2) + '%';
        }

        function moveFrame(dx, dy) {
            vfFrameX = Math.max(vfFrameW/2, Math.min(100 - vfFrameW/2, vfFrameX + dx * 2));
            vfFrameY = Math.max(vfFrameH/2, Math.min(100 - vfFrameH/2, vfFrameY + dy * 2));
            updateFramePosition();
        }

        function resizeFrame(dw, dh) {
            var nw = vfFrameW + dw * 2, nh = vfFrameH + dh * 2;
            if (nw >= 6 && nw <= 95) vfFrameW = nw;
            if (nh >= 4 && nh <= 85) vfFrameH = nh;
            vfFrameX = Math.max(vfFrameW/2, Math.min(100 - vfFrameW/2, vfFrameX));
            vfFrameY = Math.max(vfFrameH/2, Math.min(100 - vfFrameH/2, vfFrameY));
            updateFramePosition();
        }

        function captureFromViewfinder() {
            var video = document.getElementById('vfVideo');
            var canvas = document.createElement('canvas');
            var frame = document.getElementById('vfFrame');
            var fr = frame.getBoundingClientRect(), vr = video.getBoundingClientRect();
            var sx = (fr.left - vr.left) * (video.videoWidth / vr.width);
            var sy = (fr.top - vr.top) * (video.videoHeight / vr.height);
            var sw = fr.width * (video.videoWidth / vr.width);
            var sh = fr.height * (video.videoHeight / vr.height);
            canvas.width = sw; canvas.height = sh;
            canvas.getContext('2d').drawImage(video, sx, sy, sw, sh, 0, 0, sw, sh);
            var dataUrl = canvas.toDataURL('image/jpeg', 0.9);
            closeViewfinder();
            var preview = document.getElementById('preview' + (vfTarget === 'name' ? 'Name' : 'Serial') + vfDeviceNum);
            preview.src = dataUrl; preview.style.display = 'block';
            recognizeText(dataUrl, vfTarget, vfDeviceNum);
        }

        function closeViewfinder() {
            document.getElementById('viewfinder').style.display = 'none';
            if (vfStream) { vfStream.getTracks().forEach(function(t) { t.stop(); }); vfStream = null; }
            document.getElementById('vfVideo').srcObject = null;
        }

        function recognizeText(dataUrl, target, deviceNum) {
            setStatus('Распознавание...', 'loading');
            Tesseract.recognize(dataUrl, 'rus+eng', {
                tessedit_char_whitelist: 'АБВГДЕЁЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯабвгдеёжзийклмнопрстуфхцчшщъыьэюяABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789№/-. ',
                logger: function(m) { if (m.status === 'recognizing text') setStatus('Распознавание: ' + Math.round(m.progress * 100) + '%', 'loading'); }
            }).then(function(result) {
                var text = cleanText(result.data.text);
                if (target === 'name') {
                    var nameText = extractName(text);
                    document.getElementById('nameField' + deviceNum).value = nameText;
                    var ft = findTypeByName(nameText);
                    if (ft) { document.getElementById('typeField' + deviceNum).value = ft; setStatus('✅ Прибор ' + deviceNum + ': ' + nameText, 'success'); }
                    else setStatus('⚠️ Прибор ' + deviceNum + ': проверьте название', 'error');
                } else {
                    var serial = extractSerial(text);
                    document.getElementById('serialField' + deviceNum).value = serial;
                    setStatus(serial ? '✅ Прибор ' + deviceNum + ', номер: ' + serial : '⚠️ Прибор ' + deviceNum + ': проверьте номер', serial ? 'success' : 'error');
                }
            }).catch(function() { setStatus('❌ Ошибка распознавания', 'error'); });
        }

        function findTypeByName(name) {
            if (!name) return '';
            var nc = name.toLowerCase().replace(/[^a-zа-я0-9]/g, '');
            var best = '', bestScore = 0;
            typesData.forEach(function(row) {
                var ref = (row[1] || row[0] || '').toLowerCase().replace(/[^a-zа-я0-9]/g, '');
                if (ref && nc.includes(ref) && ref.length > bestScore) { bestScore = ref.length; best = row[2] || row[1] || ''; }
            });
            return best;
        }

        function cleanText(text) {
            var cleaned = text.replace(/[^а-яА-ЯёЁa-zA-Z0-9№\-\s\.\/]/g, ' ').replace(/\s+/g, ' ').trim();
            var fixes = {'Ду':'ДУ','ду':'ДУ','Ne':'№','Nе':'№','No':'№','зав':'зав','Зав':'зав','KAPAT':'КАРАТ','Kapat':'КАРАТ','карат':'КАРАТ','Карат':'КАРАТ'};
            var words = cleaned.split(' ');
            for (var i = 0; i < words.length; i++) { if (fixes[words[i]]) words[i] = fixes[words[i]]; }
            return words.join(' ');
        }

        function extractName(text) {
            var noSerial = text.replace(/зав\.?\s*[№Nn]\s*\d+/gi, '').replace(/[№Nn]\s*\d+/gi, '');
            var textClean = noSerial.toLowerCase().replace(/[^a-zа-я0-9]/g, '');
            var bestMatch = '', bestScore = 0;
            typesData.forEach(function(row) {
                var refName = (row[1] || row[0] || '').trim();
                if (!refName) return;
                var firstWord = refName.split(/[\s\-]+/)[0].toLowerCase().replace(/[^a-zа-я0-9]/g, '');
                if (firstWord.length >= 3 && textClean.indexOf(firstWord) !== -1) {
                    if (refName.length > bestScore) { bestScore = refName.length; bestMatch = refName; }
                }
            });
            return bestMatch || noSerial.replace(/\s+/g, ' ').trim();
        }

        function extractSerial(text) {
            var m = text.match(/зав\.?\s*[№Nn]\s*(\d[\d\s\-\.\/]*\d)/i) || text.match(/[№Nn]\s*(\d[\d\s\-\.\/]*\d)/i) || text.match(/\b(\d{4,})\b/);
            return m ? m[1].replace(/[^\d]/g, '') : '';
        }

        function addCompany() {
            var name = prompt('Введите название компании:');
            if (name && name.trim()) {
                document.getElementById('companySelect').innerHTML += '<option value="' + esc(name.trim()) + '" selected>' + esc(name.trim()) + '</option>';
                setStatus('Компания добавлена', 'success');
            }
        }

        function submitAct() {
            var company = document.getElementById('companySelect').value;
            var employee = document.getElementById('employeeSelect').value;
            if (!company || !employee) { alert('Выберите компанию и принявшего'); return; }
            var blocks = document.querySelectorAll('.device-block'), devices = [], allValid = true;
            blocks.forEach(function(b) {
                var n = b.id.replace('device', '');
                var type = document.getElementById('typeField' + n)?.value.trim() || '';
                var name = document.getElementById('nameField' + n)?.value.trim() || '';
                var serial = document.getElementById('serialField' + n)?.value.trim() || '';
                var note = document.getElementById('noteField' + n)?.value.trim() || '';
                if (!name || !type || !serial) { allValid = false; return; }
                devices.push({ type: type, name: name, serial: serial, note: note });
            });
            if (!allValid || devices.length === 0) { alert('Заполните все поля'); return; }
            var btn = document.getElementById('submitBtn'); btn.disabled = true; btn.textContent = 'Отправка...';
            setStatus('Формирование и отправка...', 'loading');
            var now = new Date(), dateStr = ('0'+now.getDate()).slice(-2)+'.'+('0'+(now.getMonth()+1)).slice(-2)+'.'+now.getFullYear();
            var form = document.createElement('form'); form.method = 'POST'; form.action = SCRIPT_URL; form.target = 'hiddenFrame'; form.style.display = 'none';
            var fields = { date: dateStr, company: company, employee: employee, devices: JSON.stringify(devices) };
            Object.keys(fields).forEach(function(k) {
                var inp = document.createElement('input'); inp.type = 'hidden'; inp.name = k; inp.value = fields[k]; form.appendChild(inp);
            });
            document.body.appendChild(form); form.submit(); document.body.removeChild(form);
            setTimeout(function() { setStatus('✅ Акт отправлен', 'success'); btn.textContent = '✓ Отправлено'; btn.style.background = '#4CAF50'; }, 2000);
        }

        function setStatus(msg, cls) { var el = document.getElementById('status'); el.textContent = msg; el.className = 'status'; if (cls) el.classList.add(cls); }
        function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
    </script>
</body>
</html>
